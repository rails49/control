# The broker's whole configuration. Two listeners, no authentication, and
# nothing kept across a restart.
#
# No authentication because the LAN is the trust boundary (ADR-0042): anyone
# who can reach this port can already drive, and a password here would protect
# nothing while putting a credential on the safety path.

listener 1883
listener 9001
protocol websockets

allow_anonymous true

# Retained messages do not survive the broker, on purpose. Much of the design
# is retained state — desired speed per locomotive, desired position per point,
# occupancy per block end (ADR-0043) — and a retained speed that outlived a
# power cut is a train that moves when the broker comes back. Everything comes
# back at rest instead (#123): the camera republishes occupancy within seconds
# of starting (#197), and `layout` rewrites what it wants. The ordering that
# makes a translator safe on reconnect is #204's.
persistence false

log_dest stdout
