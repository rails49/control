# The edge: one reverse proxy holding the certificate, in front of apps that
# stay native (ADR-0042). Nothing here is built and nothing is installed on
# the machine — the images are stock.
#
#   op run --env-file=deploy/op.env -- \
#     docker compose -f deploy/compose.yaml up -d                  the dev box
#   op run --env-file=deploy/op.env -- \
#     docker compose -f deploy/compose.yaml --profile layout up -d  the layout
#
# The token comes from 1Password through `op run` rather than from a file on
# disk, so nothing here holds a secret and nothing has to be kept out of the
# repository. `op.env` beside this one says where to look.
#
# Traefik rather than Caddy because the stock binary carries every ACME
# provider, Cloudflare included; Caddy's does not, and a DNS-01 certificate
# there would mean building one. Its own settings come from the environment
# (TRAEFIK_*), so the file below carries no secret and no address.
#
# One route file, named by TC49_SITE and `dev` unless it is set. Both were
# mounted at first, on the theory that a certificate is asked for when a
# request for that name arrives; it is not. Traefik asks at startup for every
# router it can see, so a box carrying both files fetches a certificate for a
# name that is not its own.

services:
  proxy:
    image: traefik:v3.3
    restart: unless-stopped
    ports:
      - "443:443"
    # The token and the ACME account, from whatever `op run` put in the
    # environment; without it compose stops rather than starting a proxy that
    # cannot renew. The values do end up in the container's own configuration,
    # where `docker inspect` can read them, which is what a container
    # environment is. Docker Desktop publishes 443 through its privileged
    # helper, so none of this wants root.
    environment:
      CF_DNS_API_TOKEN: ${CF_DNS_API_TOKEN:?run this under op run --env-file=deploy/op.env}
      TRAEFIK_CERTIFICATESRESOLVERS_LE_ACME_EMAIL: ${TRAEFIK_CERTIFICATESRESOLVERS_LE_ACME_EMAIL:?run this under op run --env-file=deploy/op.env}
    command:
      - --entryPoints.websecure.address=:443
      - --providers.file.directory=/etc/traefik/routes
      - --providers.file.watch=true
      - --certificatesResolvers.le.acme.storage=/acme/acme.json
      - --certificatesResolvers.le.acme.dnsChallenge.provider=cloudflare
      # Before writing the TXT record lego asks which zone the name belongs
      # to, and a consumer router answers that question with SERVFAIL often
      # enough that the resolver cannot be left to whatever the network hands
      # the container. These two are asked instead.
      - --certificatesResolvers.le.acme.dnsChallenge.resolvers=1.1.1.1:53,9.9.9.9:53
    volumes:
      - ./routes/${TC49_SITE:-dev}.yaml:/etc/traefik/routes/site.yaml:ro
      - acme:/acme
    # How a container reaches an app on the host. Docker Desktop supplies the
    # name already; on Linux this is what supplies it.
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # The built UI, which Traefik cannot serve itself: it proxies and does not
  # read files. Only the layout box has a build to serve — the dev box has
  # vite — so it is a profile rather than a service.
  web:
    image: nginx:alpine
    profiles: [layout]
    restart: unless-stopped
    volumes:
      - ../ui/dist:/usr/share/nginx/html:ro

  # The bus. It is here before the first train because the occupancy camera
  # publishes to it while our own apps may still share the in-process binding
  # (ADR-0043); #173 is what moves them across. Both boxes get one — the dev
  # box needs somewhere to do that work.
  #
  # Two listeners: 1883 for native clients and 9001 for a browser, published
  # on the LAN because that is the trust boundary and there is no
  # authentication anywhere (ADR-0042). A page served over TLS cannot open a
  # `ws://` socket, which is the defect #174 found in the run view, so the
  # layout box also reaches 9001 through the proxy as `/mqtt`.
  broker:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  # The one container that owns the command station's USB device, mirroring it
  # to TCP 2560 so the dccex translator, JMRI and hand-held throttles share one
  # command station (ADR-0043, #219). The device is named by its `by-id` path
  # rather than `/dev/ttyUSB0`, which renumbers, and lands inside as
  # `/dev/dccex` so the command line says nothing about which chip is in the
  # cable.
  dccex-usb:
    build: &app
      context: ..
      dockerfile: deploy/app.Dockerfile
    profiles: [layout]
    restart: unless-stopped
    ports:
      - "2560:2560"
    devices:
      - "${TC49_STATION_DEVICE:-/dev/serial/by-id/usb-1a86_USB_Serial-if00-port0}:/dev/dccex"
    command:
      ["python", "-m", "tc49.dccex_usb", "--device", "/dev/dccex", "--port", "2560"]

  # The store's HTTP face, always on, because the documents are the one thing
  # here that is nobody's run: the editor reads and writes them whether or not
  # a railroad is moving (#354). The layout box holds the authoritative copy —
  # it is the machine wired to the steel — rooted at a directory on the host
  # rather than a volume, so it stays somewhere a person can `cd` into and push
  # from (#320). A fresh box has no `~/tc49` and the bind mount makes it: an
  # empty store is an ordinary state and the server comes up and answers.
  #
  # Bound to every interface because the proxy reaches it from another
  # container; what limits its reach is the LAN (ADR-0042), and a page on
  # another origin is refused at the face itself (ADR-0057).
  store:
    build: *app
    profiles: [layout]
    restart: unless-stopped
    volumes:
      - ${TC49_STORE:-~/tc49}:/store
    command: ["tc49", "serve", "--host", "0.0.0.0", "--store", "/store"]

  # A session: one run of one railroad, and the only thing here that is not
  # infrastructure. It is started deliberately rather than kept up, because a
  # run has an operator and a railroad chosen and `bench` is the harness that
  # wires the apps together rather than an app (CLAUDE.md, #354) — so `/live`
  # answers 502 until somebody starts one, which is the truth.
  #
  #   docker compose -f deploy/compose.yaml --profile session \
  #     run -d --use-aliases --name session session gotthard
  #   docker attach session                 to type the readings
  #
  # `run` rather than `up`, because the railroad is named when the session is
  # started and not in this file: a station drives one physical railroad, so
  # `tc49 live --station` refuses to come up without it, and a compose variable
  # that has no default would have to be set for every other invocation of this
  # file too. `--use-aliases` is what puts the container on the network under
  # its service name, which is how the proxy's `/live` route finds it.
  #
  # It reaches the command station through the mirror rather than the device,
  # which is what lets JMRI and a hand-held throttle share it (ADR-0043), and
  # it reads the same store the face above serves. `TC49_STATION` moves it:
  # the default is this box's mirror, and a station reachable some other way
  # is an address like any other. What it speaks is DCC-EX either way — a
  # railroad JMRI drives wants the `jmri` translator ADR-0043 designs and
  # nothing implements (#357).
  #
  # No `depends_on`: the store and the mirror belong to the `layout` profile
  # and are already up, and naming them here would drag that profile into
  # every invocation of this one.
  #
  # `stdin_open` because a session driving a station reads this process's own
  # input, which is where a person types the readings no detector publishes
  # yet (#315). It also keeps stdin from closing when nobody is attached,
  # which would otherwise end the session moments after it started.
  session:
    build: *app
    profiles: [session]
    restart: "no"
    stdin_open: true
    tty: true
    volumes:
      - ${TC49_STORE:-~/tc49}:/store
    # An entrypoint and no command: the flags are the same every time and the
    # railroad is what `run` appends, so `run … session gotthard` is the whole
    # of what an operator types.
    entrypoint:
      - "tc49"
      - "live"
      - "--store"
      - "/store"
      - "--host"
      - "0.0.0.0"
      - "--station"
      - "${TC49_STATION:-dccex-usb:2560}"

  # JMRI, a third-party GUI appliance and none of this app's business: an
  # operator's DecoderPro and panel tool, reaching the same command station as a
  # plain client of 2560 (#196). Nothing of ours is in it and it owns no device.
  # The image does not start JMRI — a person clicks DecoderPro through noVNC on
  # 6901 — and `/home/jmri` is a volume because that is where the click that
  # points it at `dccex-usb` persists.
  jmri:
    image: jsa1987/jmri-docker:stable
    # A fresh /tmp on every start. The image's websockify dials
    # `localhost:5901` while its `vncserver` takes the first display that has
    # no socket in /tmp/.X11-unix, and `docker restart` keeps the writable
    # layer — so each restart leaks a socket, burns a display, and moves the
    # VNC server one port away from the one noVNC connects to. The entrypoint
    # is upstream's and stays untouched (ADR-0043); this makes the leak
    # impossible instead.
    tmpfs:
      - /tmp
    profiles: [layout]
    restart: unless-stopped
    ports:
      - "6901:6901"
      - "5901:5901"
      - "12080:12080"
    volumes:
      - jmri:/home/jmri

volumes:
  acme:
  jmri:
