# The railroad, and nothing in front of it. Every container a browser reaches
# carries its own routers as labels; what reads them is the door, the one
# thing in front of everything a browser reaches on the box, which is the
# installation's rather than this repository's (ADR-0009). So there is
# no proxy here, no entry point on 80 or 443, no ACME credential and no route
# file: being reachable stopped being a railroad's business (#557).
#
#   docker compose --env-file /etc/rails49/box.env \
#     --env-file /etc/rails49/deploy.env -f deploy/compose.yaml up -d
#
# Two files, both the box's and neither in this clone. The first is the box's
# declaration of itself, which every stack on the box is started against, so
# that two stacks cannot come to different answers about the box's name. The
# second is this stack's own settings — which railroad it comes up on, where
# its store is, which device the command station is on. `scripts/deploy.sh` is
# that command run over ssh.
#
# The name in every label comes from the declaration by compose substitution —
# no template is rendered and no file is copied — so a box is named in one
# place rather than in a route file this repository would have to be forked to
# edit.
#
# The project's name, which compose otherwise takes from the directory this
# file sits in — `deploy`, which says where the file is rather than what the
# stack is, and which a clone under another name would spell differently. Said
# here instead, so the containers are `tc49-store-1` and stay so wherever the
# clone lives. Not a `container_name` on each service, which was the other way
# to the same names: that one is the daemon's name rather than the project's,
# so `-p` would stop working and a second copy of this stack — a throwaway one
# for testing a change to this file — could never run beside the first (#451).

name: tc49

# Nothing reads this. It is where the box's name is required, so that a box
# with no declaration is told which variable is missing rather than given
# routers under a blank name — compose interpolates the whole file before it
# runs any subcommand, so one line here covers every rule below and every
# `logs` and `ps` besides.
x-require-box-domain: ${BOX_DOMAIN:?start this with --env-file /etc/rails49/box.env}

services:
  # The built UI, which the door cannot serve itself: it proxies and does not
  # read files. Only a box has a build to serve — a development machine has
  # vite — so it is a profile rather than a service.
  #
  # The first of the three containers a browser reaches, and so the first to
  # carry its own router. Everything under `traefik.` here is read by the
  # door, which is on the box and not in this file (#556, #557).
  #
  # Every router here names the service it dials and every service names its
  # port, including this one, where the image exposes 80 and nothing else. The
  # door would pick that port itself; a reader would have to know it does.
  web:
    image: nginx:alpine
    profiles: [layout]
    restart: unless-stopped
    volumes:
      - ../ui/dist:/usr/share/nginx/html:ro
    labels:
      - traefik.enable=true
      - traefik.docker.network=rails49
      - traefik.http.services.tc49-app.loadbalancer.server.port=80
      - traefik.http.routers.tc49-app.rule=Host(`control.${BOX_DOMAIN}`)
      - traefik.http.routers.tc49-app.priority=1
      - traefik.http.routers.tc49-app.entrypoints=websecure
      - traefik.http.routers.tc49-app.service=tc49-app
      - traefik.http.routers.tc49-app.tls.certresolver=le
    networks: [default, rails49]

  # The bus. It is here before the first train because the occupancy camera
  # publishes to it while our own apps may still share the in-process binding
  # (ADR-0043); #173 is what moves them across. Both boxes get one — the dev
  # box needs somewhere to do that work.
  #
  # Two listeners: 1883 for native clients and 9001 for a browser, published
  # on the LAN because that is the trust boundary and there is no
  # authentication anywhere (ADR-0042). A page served over TLS cannot open a
  # `ws://` socket, which is the defect #174 found in the run view, so 9001 is
  # also reached through the door as `/mqtt`.
  broker:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    # The bus behind the door, and the refusal in front of it. Both routers
    # dial 9001 — a browser's listener; a native client goes straight to 1883
    # and never comes this way — so the service is named once and each router
    # says it, rather than leaving a container with two routers and one
    # service to a default.
    #
    # The refusal is a router of its own carrying a middleware that answers
    # 403 before the service behind it: a foreign page gets no socket to be
    # told over. Mosquitto has no `Origin` setting, so the rule is stated here
    # rather than in an app, `lib/origin.py` being the same rule at the store's
    # face (ADR-0056, ADR-0059 decision 4).
    #
    # The origins it admits are compared whole rather than matched. The name
    # comes from the box's declaration and a dot inside it cannot be escaped on
    # its way into a pattern, and `control.gleis49.org` as a pattern admits
    # `control-gleis49.org`, which somebody may register. Two of them because
    # TLS terminates at the door and a page on the app's own origin is the app
    # (ADR-0042, ADR-0055).
    #
    # Matching `Origin` at all is what selects the refusal, so a handshake
    # carrying none — a native client, `mosquitto_sub`, the suite — does not
    # match it and falls through to the router above: no header, no page.
    labels:
      - traefik.enable=true
      - traefik.docker.network=rails49
      - traefik.http.services.tc49-mqtt.loadbalancer.server.port=9001
      - traefik.http.routers.tc49-mqtt.rule=Host(`control.${BOX_DOMAIN}`) && PathPrefix(`/mqtt`)
      - traefik.http.routers.tc49-mqtt.priority=2
      - traefik.http.routers.tc49-mqtt.entrypoints=websecure
      - traefik.http.routers.tc49-mqtt.service=tc49-mqtt
      - traefik.http.routers.tc49-mqtt.middlewares=tc49-mqtt-strip
      - traefik.http.routers.tc49-mqtt.tls.certresolver=le
      - traefik.http.middlewares.tc49-mqtt-strip.stripprefix.prefixes=/mqtt
      - traefik.http.routers.tc49-mqtt-foreign.rule=Host(`control.${BOX_DOMAIN}`) && PathPrefix(`/mqtt`) && HeaderRegexp(`Origin`, `.`) && !Header(`Origin`, `https://control.${BOX_DOMAIN}`) && !Header(`Origin`, `http://control.${BOX_DOMAIN}`)
      - traefik.http.routers.tc49-mqtt-foreign.priority=3
      - traefik.http.routers.tc49-mqtt-foreign.entrypoints=websecure
      - traefik.http.routers.tc49-mqtt-foreign.service=tc49-mqtt
      - traefik.http.routers.tc49-mqtt-foreign.middlewares=tc49-mqtt-refused
      - traefik.http.routers.tc49-mqtt-foreign.tls.certresolver=le
      # Traefik has no middleware whose job is to refuse, and this is the one
      # that answers 403 without reaching the service behind it: no source
      # address is `255.255.255.255`, the limited broadcast address, so every
      # request routed here is refused.
      - traefik.http.middlewares.tc49-mqtt-refused.ipallowlist.sourcerange=255.255.255.255/32
    networks: [default, rails49]

  # The one container that owns the command station's USB device, mirroring it
  # to TCP 2560 so the dccex translator, JMRI and hand-held throttles share one
  # command station (ADR-0043, #219). The device is named by its `by-id` path
  # rather than `/dev/ttyUSB0`, which renumbers, and lands inside as
  # `/dev/dccex` so the command line says nothing about which chip is in the
  # cable.
  dccex-usb:
    build: &app
      context: ..
      dockerfile: deploy/app.Dockerfile
    profiles: [hardware]
    restart: unless-stopped
    ports:
      - "2560:2560"
    devices:
      - "${TC49_STATION_DEVICE:-/dev/serial/by-id/usb-1a86_USB_Serial-if00-port0}:/dev/dccex"
    command:
      ["python", "-m", "tc49.dccex_usb",
       "--broker", "broker:1883",
       "--device", "/dev/dccex",
       "--port", "2560"]

  # The store's HTTP face, always on, because the documents are the one thing
  # here that is nobody's run: the editor reads and writes them whether or not
  # a railroad is moving (#354). The layout box holds the authoritative copy —
  # it is the machine wired to the steel — rooted at a directory on the host
  # rather than a volume, so it stays somewhere a person can `cd` into and push
  # from (#320). `scripts/deploy.sh` makes that directory before it runs this
  # file, because a bind mount whose source is missing is made by Docker as
  # root and shuts the person out of their own documents (#387); an empty
  # store is an ordinary state and the server comes up and answers.
  #
  # Bound to every interface because the door reaches it from another
  # container; what limits its reach is the LAN (ADR-0042), and a page on
  # another origin is refused at the face itself (ADR-0057).
  store:
    build: *app
    profiles: [layout]
    restart: unless-stopped
    # The person who deployed the box, not root (#387). Every drawing the
    # editor saves and every object the backup commits is theirs on the host,
    # so the store stays a directory they can edit, `git init` and push from
    # rather than one only the container can write. `deploy.sh` exports these
    # from `id -u` and `id -g` there; the default is the account an Ubuntu
    # install makes for the person who installed it.
    user: "${TC49_UID:-1000}:${TC49_GID:-1000}"
    # What git needs to commit here: an identity, because a container has none
    # and git will not commit without one; the commits are the app's, made on
    # the person's behalf, and are named so. No `safe.directory` — this
    # process is the person now, so git is not looking at a repository owned
    # by somebody else (#387).
    #
    # `HOME` because the passwd file below names a home this image does not
    # have, and ssh says so on stderr when it cannot make `~/.ssh` there —
    # git's words are what the backup dialog shows, so they are kept about
    # the push. Nothing is kept in it: the host keys are in the image and the
    # deploy key is in `keys`.
    environment:
      GIT_CONFIG_COUNT: "2"
      GIT_CONFIG_KEY_0: user.name
      GIT_CONFIG_VALUE_0: tc49 backup
      GIT_CONFIG_KEY_1: user.email
      GIT_CONFIG_VALUE_1: backup@tc49.invalid
      HOME: /tmp
    # `keys` holds the deploy key the store makes for itself and pushes with
    # (#355): a volume rather than a path in the store, so that no commit can
    # ever carry the private half, and a volume rather than a host directory,
    # so that nothing on the host is made or pointed at. It outlives the
    # container, which is rebuilt on every deploy.
    #
    # OpenSSH refuses to run for a uid with no passwd entry — "No user exists
    # for uid" — and the backup pushes over ssh, so the host's own tables come
    # in read-only to give this uid a name. `nss_wrapper` would answer the
    # same question inside the image; this asks nothing of the image.
    volumes:
      - ${TC49_STORE:-~/tc49}:/store
      - keys:/keys
      - /etc/passwd:/etc/passwd:ro
      - /etc/group:/etc/group:ro
    command:
      ["tc49", "serve", "--host", "0.0.0.0", "--store", "/store", "--keys", "/keys"]
    # The store's six path prefixes, on the app's own origin. They are the
    # store's own list and nothing else's, which is the point of stating them
    # here: `tests/system/test_store_routes_are_proxied.py` reads them off the
    # server's route list and holds every place a request has to pass to it.
    labels:
      - traefik.enable=true
      - traefik.docker.network=rails49
      - traefik.http.services.tc49-store.loadbalancer.server.port=8765
      - traefik.http.routers.tc49-store.rule=Host(`control.${BOX_DOMAIN}`) && (PathPrefix(`/backup`) || PathPrefix(`/drawings`) || PathPrefix(`/review`) || PathPrefix(`/layouts`) || PathPrefix(`/rosters`) || PathPrefix(`/catalogue`))
      - traefik.http.routers.tc49-store.priority=2
      - traefik.http.routers.tc49-store.entrypoints=websecure
      - traefik.http.routers.tc49-store.service=tc49-store
      - traefik.http.routers.tc49-store.tls.certresolver=le
    networks: [default, rails49]

  # The six apps, one service each (ADR-0059, decision 5). Every one of them
  # comes up alone: started against nothing, it connects, publishes the rows
  # it owns and stays up, and one that reads the railroad's documents retries
  # the store until it answers. **No `depends_on` anywhere** — an order here
  # would say a container being up is a store answering, which it is not, and
  # `tests/system/test_compose.py` refuses one.
  #
  # Which railroad they come up on is `TC49_RAILROAD`, a box's own answer in
  # its env file. It is a starting point rather than a binding: a person
  # loads another railroad from the app while these run, and every one of
  # them follows the row that says so without a restart (ADR-0060), so
  # changing it here is not how a railroad is chosen.
  #
  # **It has no default**, and the flag below is passed empty where a box
  # has named none: an app with no railroad **stands** — up, publishing
  # nothing, built on the first one named that the store can give
  # (`lib/loading.py`). A default naming a railroad is a default that cannot
  # resolve. An empty store is an ordinary state and nothing seeds it
  # (docs/DEPLOY.md), the railroads in this repository are fixtures under
  # `bench/` on nobody's box, and `gotthard` — what stood here — named no
  # drawing anywhere, so it put four of these into a restart loop on the
  # first box booted against an empty store (#564).
  #
  # `layout` and `simulator` are two bindings of one interface and never run
  # together: one writing role (ADR-0035) means the box wired to steel runs
  # `layout` under the `layout` profile, and a box with none runs `simulator`
  # under `sim` in its place.
  scheduler:
    build: *app
    profiles: [layout]
    restart: unless-stopped
    command:
      ["python", "-m", "tc49.scheduler",
       "--broker", "broker:1883",
       "--railroad", "${TC49_RAILROAD:-}",
       "--store", "http://store:8765"]

  dispatcher:
    build: *app
    profiles: [layout]
    restart: unless-stopped
    command:
      ["python", "-m", "tc49.dispatcher",
       "--broker", "broker:1883",
       "--railroad", "${TC49_RAILROAD:-}",
       "--store", "http://store:8765"]

  # No `--store`: the driver reads no documents. The railroad is named all
  # the same, because a container's log says which railroad it is driving.
  driver:
    build: *app
    profiles: [layout]
    restart: unless-stopped
    command:
      ["python", "-m", "tc49.driver",
       "--broker", "broker:1883",
       "--railroad", "${TC49_RAILROAD:-}"]

  # The layout interface: the one app bound to a railroad, and the writer of
  # what the hardware is asked to do. On the box wired to steel, so it is in
  # the `layout` profile with the store it reads.
  layout:
    build: *app
    profiles: [layout]
    restart: unless-stopped
    command:
      ["python", "-m", "tc49.layout",
       "--broker", "broker:1883",
       "--railroad", "${TC49_RAILROAD:-}",
       "--store", "http://store:8765"]

  # The simulator standing in for the steel, on a box that has none: the
  # milestone-1 binding of the same interface (ADR-0030). A profile of its
  # own, because it and `layout` are alternatives.
  simulator:
    build: *app
    profiles: [sim]
    restart: unless-stopped
    command:
      ["python", "-m", "tc49.simulator",
       "--broker", "broker:1883",
       "--railroad", "${TC49_RAILROAD:-}",
       "--store", "http://store:8765"]

  # The translator: the device vocabulary turned into the command station's
  # own language, over the mirror rather than the device (ADR-0043). Hardware
  # by what it talks to, so it comes up with the rest of the hardware and not
  # with the software — and it takes no railroad and no store, hardware
  # needing no layout (ADR-0059, decision 5).
  #
  # `--startup` is this installation's per-district trip currents (#217), the
  # one hardware fact that reaches no bus topic and no document. Passed here
  # because for as long as nothing passed it the values reached the station by
  # not existing: the flag was whole, documented and connected to nothing
  # (#523).
  #
  # The **file**, not `/etc/rails49`, which also holds `acme.env` — the box's
  # ACME credential, which the door alone reads (docs/DEPLOY.md) — and a
  # directory mount would put that inside the translator's container. So the
  # inode a single-file mount binds is what it costs: an editor that replaces
  # the file rather than writing through it leaves this container reading the
  # values it was created with, so the file is edited in place and a container
  # that has lost it is recreated (docs/DEPLOY.md). `scripts/deploy.sh` makes
  # the file before compose runs, because a missing source is made by the
  # daemon as a root-owned directory (#387) and the translator would then open
  # a directory as its startup file. An empty one is an ordinary state: a
  # railroad with no file powers on at the firmware's own limits (ADR-0050).
  dccex:
    build: *app
    profiles: [hardware]
    restart: unless-stopped
    volumes:
      - /etc/rails49/dccex-startup.txt:/etc/rails49/dccex-startup.txt:ro
    command:
      ["python", "-m", "tc49.dccex",
       "--broker", "broker:1883",
       "--station", "${TC49_STATION:-dccex-usb:2560}",
       "--startup", "/etc/rails49/dccex-startup.txt"]

# The one network every stack on the box shares, created by the installation
# under a fixed name four repositories hardcode and joined here by the three
# containers a browser reaches (rails49/installation ADR-0001). External,
# because a stack that makes it when it is absent is a stack that silently
# decides its options, and the first one started would decide them for the
# rest. A box that has not installed the installation yet is told so before
# anything comes up, which is the whole of the ordering requirement:
#
#   network rails49 declared as external, but could not be found
networks:
  rails49:
    external: true

volumes:
  keys:
