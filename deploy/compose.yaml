# The edge: one reverse proxy holding the certificate, in front of apps that
# stay native (ADR-0042). Nothing here is built and nothing is installed on
# the machine — the images are stock.
#
#   op run --env-file=deploy/op.env -- \
#     docker compose -f deploy/compose.yaml up -d                  the dev box
#   op run --env-file=deploy/op.env -- \
#     docker compose -f deploy/compose.yaml --profile layout up -d  the layout
#
# The token comes from 1Password through `op run` rather than from a file on
# disk, so nothing here holds a secret and nothing has to be kept out of the
# repository. `op.env` beside this one says where to look.
#
# Traefik rather than Caddy because the stock binary carries every ACME
# provider, Cloudflare included; Caddy's does not, and a DNS-01 certificate
# there would mean building one. Its own settings come from the environment
# (TRAEFIK_*), so the file below carries no secret and no address.
#
# One route file, named by TC49_SITE and `dev` unless it is set. Both were
# mounted at first, on the theory that a certificate is asked for when a
# request for that name arrives; it is not. Traefik asks at startup for every
# router it can see, so a box carrying both files fetches a certificate for a
# name that is not its own.

services:
  proxy:
    image: traefik:v3.3
    restart: unless-stopped
    ports:
      - "443:443"
    # The token and the ACME account, from whatever `op run` put in the
    # environment; without it compose stops rather than starting a proxy that
    # cannot renew. The values do end up in the container's own configuration,
    # where `docker inspect` can read them, which is what a container
    # environment is. Docker Desktop publishes 443 through its privileged
    # helper, so none of this wants root.
    environment:
      CF_DNS_API_TOKEN: ${CF_DNS_API_TOKEN:?run this under op run --env-file=deploy/op.env}
      TRAEFIK_CERTIFICATESRESOLVERS_LE_ACME_EMAIL: ${TRAEFIK_CERTIFICATESRESOLVERS_LE_ACME_EMAIL:?run this under op run --env-file=deploy/op.env}
    command:
      - --entryPoints.websecure.address=:443
      - --providers.file.directory=/etc/traefik/routes
      - --providers.file.watch=true
      - --certificatesResolvers.le.acme.storage=/acme/acme.json
      - --certificatesResolvers.le.acme.dnsChallenge.provider=cloudflare
      # Before writing the TXT record lego asks which zone the name belongs
      # to, and a consumer router answers that question with SERVFAIL often
      # enough that the resolver cannot be left to whatever the network hands
      # the container. These two are asked instead.
      - --certificatesResolvers.le.acme.dnsChallenge.resolvers=1.1.1.1:53,9.9.9.9:53
    volumes:
      - ./routes/${TC49_SITE:-dev}.yaml:/etc/traefik/routes/site.yaml:ro
      - acme:/acme
    # How a container reaches an app on the host. Docker Desktop supplies the
    # name already; on Linux this is what supplies it.
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # The built UI, which Traefik cannot serve itself: it proxies and does not
  # read files. Only the layout box has a build to serve — the dev box has
  # vite — so it is a profile rather than a service.
  web:
    image: nginx:alpine
    profiles: [layout]
    restart: unless-stopped
    volumes:
      - ../ui/dist:/usr/share/nginx/html:ro

  # The bus. It is here before the first train because the occupancy camera
  # publishes to it while our own apps may still share the in-process binding
  # (ADR-0043); #173 is what moves them across. Both boxes get one — the dev
  # box needs somewhere to do that work.
  #
  # Two listeners: 1883 for native clients and 9001 for a browser, published
  # on the LAN because that is the trust boundary and there is no
  # authentication anywhere (ADR-0042). A page served over TLS cannot open a
  # `ws://` socket, which is the defect #174 found in the run view, so the
  # layout box also reaches 9001 through the proxy as `/mqtt`.
  broker:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  # The one container that owns the command station's USB device, mirroring it
  # to TCP 2560 so the dccex translator, JMRI and hand-held throttles share one
  # station (ADR-0043, #219). The device is named by its `by-id` path rather
  # than `/dev/ttyUSB0`, which renumbers, and lands inside as `/dev/dccex` so
  # the command line says nothing about which chip is in the cable.
  station:
    build:
      context: ..
      dockerfile: deploy/station.Dockerfile
    profiles: [layout]
    restart: unless-stopped
    ports:
      - "2560:2560"
    devices:
      - "${TC49_STATION_DEVICE:-/dev/serial/by-id/usb-1a86_USB_Serial-if00-port0}:/dev/dccex"
    command: ["--device", "/dev/dccex", "--port", "2560"]

  # JMRI, a third-party GUI appliance and none of this app's business: an
  # operator's DecoderPro and panel tool, reaching the same station as a plain
  # client of 2560 (#196). Nothing of ours is in it and it owns no device. The
  # image does not start JMRI — a person clicks DecoderPro through noVNC on
  # 6901 — and `/home/jmri` is a volume because that is where the click that
  # points it at the station persists.
  jmri:
    image: jsa1987/jmri-docker:stable
    profiles: [layout]
    restart: unless-stopped
    ports:
      - "6901:6901"
      - "5901:5901"
      - "12080:12080"
    volumes:
      - jmri:/home/jmri

volumes:
  acme:
  jmri:
