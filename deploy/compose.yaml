# The edge: one reverse proxy holding the certificate, in front of apps that
# stay native (ADR-0042). Nothing here is built and nothing is installed on
# the machine — the images are stock.
#
#   op run --env-file=deploy/op.env -- \
#     docker compose -f deploy/compose.yaml up -d                  the dev box
#   op run --env-file=deploy/op.env -- \
#     docker compose -f deploy/compose.yaml --profile layout up -d  the layout
#
# The token comes from 1Password through `op run` rather than from a file on
# disk, so nothing here holds a secret and nothing has to be kept out of the
# repository. `op.env` beside this one says where to look.
#
# Traefik rather than Caddy because the stock binary carries every ACME
# provider, Cloudflare included; Caddy's does not, and a DNS-01 certificate
# there would mean building one. Its own settings come from the environment
# (TRAEFIK_*), so the file below carries no secret and no address.
#
# One route directory, named by TC49_SITE and `dev` unless it is set, holding
# that site's `site.yaml` and nothing else. Both files were mounted at first,
# on the theory that a certificate is asked for when a request for that name
# arrives; it is not. Traefik asks at startup for every router it can see, so
# a box carrying both files fetches a certificate for a name that is not its
# own — which is why the directory holds one file rather than the mount
# picking one out of a directory holding two.

services:
  proxy:
    image: traefik:v3.3
    restart: unless-stopped
    # 80 carries a redirect and nothing else. A person types a bare hostname
    # and the browser tries http, so a box that publishes 443 alone refuses
    # the connection and the site reads as down (#364). The certificate comes
    # from a DNS-01 challenge, so nothing here needs 80 to reach the outside.
    ports:
      - "80:80"
      - "443:443"
    # The token and the ACME account, from whatever `op run` put in the
    # environment; without it compose stops rather than starting a proxy that
    # cannot renew. The values do end up in the container's own configuration,
    # where `docker inspect` can read them, which is what a container
    # environment is. Docker Desktop publishes 443 through its privileged
    # helper, so none of this wants root.
    environment:
      CF_DNS_API_TOKEN: ${CF_DNS_API_TOKEN:?run this under op run --env-file=deploy/op.env}
      TRAEFIK_CERTIFICATESRESOLVERS_LE_ACME_EMAIL: ${TRAEFIK_CERTIFICATESRESOLVERS_LE_ACME_EMAIL:?run this under op run --env-file=deploy/op.env}
    command:
      - --entryPoints.web.address=:80
      - --entryPoints.web.http.redirections.entryPoint.to=websecure
      - --entryPoints.web.http.redirections.entryPoint.scheme=https
      - --entryPoints.websecure.address=:443
      - --providers.file.directory=/etc/traefik/routes
      - --providers.file.watch=true
      - --certificatesResolvers.le.acme.storage=/acme/acme.json
      - --certificatesResolvers.le.acme.dnsChallenge.provider=cloudflare
      # Before writing the TXT record lego asks which zone the name belongs
      # to, and a consumer router answers that question with SERVFAIL often
      # enough that the resolver cannot be left to whatever the network hands
      # the container. These two are asked instead.
      - --certificatesResolvers.le.acme.dnsChallenge.resolvers=1.1.1.1:53,9.9.9.9:53
    # The directory, not the file inside it. A single-file bind mount binds the
    # inode, and `git pull` replaces a file rather than writing through it, so
    # the container kept the table it started with and the file watch above
    # watched something nothing touched any more (#353). A directory mount
    # sees the replacement, so a deploy is `git pull` and `up` with no
    # `--force-recreate` behind it.
    volumes:
      - ./routes/${TC49_SITE:-dev}:/etc/traefik/routes:ro
      - acme:/acme
    # How a container reaches an app on the host. Docker Desktop supplies the
    # name already; on Linux this is what supplies it.
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # The built UI, which Traefik cannot serve itself: it proxies and does not
  # read files. Only the layout box has a build to serve — the dev box has
  # vite — so it is a profile rather than a service.
  web:
    image: nginx:alpine
    profiles: [layout]
    restart: unless-stopped
    volumes:
      - ../ui/dist:/usr/share/nginx/html:ro

  # The bus. It is here before the first train because the occupancy camera
  # publishes to it while our own apps may still share the in-process binding
  # (ADR-0043); #173 is what moves them across. Both boxes get one — the dev
  # box needs somewhere to do that work.
  #
  # Two listeners: 1883 for native clients and 9001 for a browser, published
  # on the LAN because that is the trust boundary and there is no
  # authentication anywhere (ADR-0042). A page served over TLS cannot open a
  # `ws://` socket, which is the defect #174 found in the run view, so the
  # layout box also reaches 9001 through the proxy as `/mqtt`.
  broker:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  # The one container that owns the command station's USB device, mirroring it
  # to TCP 2560 so the dccex translator, JMRI and hand-held throttles share one
  # command station (ADR-0043, #219). The device is named by its `by-id` path
  # rather than `/dev/ttyUSB0`, which renumbers, and lands inside as
  # `/dev/dccex` so the command line says nothing about which chip is in the
  # cable.
  dccex-usb:
    build: &app
      context: ..
      dockerfile: deploy/app.Dockerfile
    profiles: [hardware]
    restart: unless-stopped
    ports:
      - "2560:2560"
    devices:
      - "${TC49_STATION_DEVICE:-/dev/serial/by-id/usb-1a86_USB_Serial-if00-port0}:/dev/dccex"
    command:
      ["python", "-m", "tc49.dccex_usb", "--device", "/dev/dccex", "--port", "2560"]

  # The store's HTTP face, always on, because the documents are the one thing
  # here that is nobody's run: the editor reads and writes them whether or not
  # a railroad is moving (#354). The layout box holds the authoritative copy —
  # it is the machine wired to the steel — rooted at a directory on the host
  # rather than a volume, so it stays somewhere a person can `cd` into and push
  # from (#320). `scripts/deploy.sh` makes that directory before it runs this
  # file, because a bind mount whose source is missing is made by Docker as
  # root and shuts the person out of their own documents (#387); an empty
  # store is an ordinary state and the server comes up and answers.
  #
  # Bound to every interface because the proxy reaches it from another
  # container; what limits its reach is the LAN (ADR-0042), and a page on
  # another origin is refused at the face itself (ADR-0057).
  store:
    build: *app
    profiles: [layout]
    restart: unless-stopped
    # The person who deployed the box, not root (#387). Every drawing the
    # editor saves and every object the backup commits is theirs on the host,
    # so the store stays a directory they can edit, `git init` and push from
    # rather than one only the container can write. `deploy.sh` exports these
    # from `id -u` and `id -g` there; the default is the account an Ubuntu
    # install makes for the person who installed it.
    user: "${TC49_UID:-1000}:${TC49_GID:-1000}"
    # What git needs to commit here: an identity, because a container has none
    # and git will not commit without one; the commits are the app's, made on
    # the person's behalf, and are named so. No `safe.directory` — this
    # process is the person now, so git is not looking at a repository owned
    # by somebody else (#387).
    #
    # `HOME` because the passwd file below names a home this image does not
    # have, and ssh says so on stderr when it cannot make `~/.ssh` there —
    # git's words are what the backup dialog shows, so they are kept about
    # the push. Nothing is kept in it: the host keys are in the image and the
    # deploy key is in `keys`.
    environment:
      GIT_CONFIG_COUNT: "2"
      GIT_CONFIG_KEY_0: user.name
      GIT_CONFIG_VALUE_0: tc49 backup
      GIT_CONFIG_KEY_1: user.email
      GIT_CONFIG_VALUE_1: backup@tc49.invalid
      HOME: /tmp
    # `keys` holds the deploy key the store makes for itself and pushes with
    # (#355): a volume rather than a path in the store, so that no commit can
    # ever carry the private half, and a volume rather than a host directory,
    # so that nothing on the host is made or pointed at. It outlives the
    # container, which is rebuilt on every deploy.
    #
    # OpenSSH refuses to run for a uid with no passwd entry — "No user exists
    # for uid" — and the backup pushes over ssh, so the host's own tables come
    # in read-only to give this uid a name. `nss_wrapper` would answer the
    # same question inside the image; this asks nothing of the image.
    volumes:
      - ${TC49_STORE:-~/tc49}:/store
      - keys:/keys
      - /etc/passwd:/etc/passwd:ro
      - /etc/group:/etc/group:ro
    command:
      ["tc49", "serve", "--host", "0.0.0.0", "--store", "/store", "--keys", "/keys"]

  # The six apps, one service each (ADR-0059, decision 5). Every one of them
  # comes up alone: started against nothing, it connects, publishes the rows
  # it owns and stays up, and one that reads the railroad's documents retries
  # the store until it answers. **No `depends_on` anywhere** — an order here
  # would say a container being up is a store answering, which it is not, and
  # `tests/system/test_compose.py` refuses one.
  #
  # Which railroad they come up on is `TC49_RAILROAD`, a box's own answer in
  # its env file. It is a starting point rather than a binding: a person
  # loads another railroad from the app while these run, and every one of
  # them follows the row that says so without a restart (ADR-0060), so
  # changing it here is not how a railroad is chosen.
  #
  # `layout` and `simulator` are two bindings of one interface and never run
  # together: one writing role (ADR-0035) means the box wired to steel runs
  # `layout` under the `layout` profile, and a box with none runs `simulator`
  # under `sim` in its place.
  scheduler:
    build: *app
    profiles: [layout]
    restart: unless-stopped
    command:
      ["python", "-m", "tc49.scheduler",
       "--broker", "broker:1883",
       "--railroad", "${TC49_RAILROAD:-gotthard}",
       "--store", "http://store:8765"]

  dispatcher:
    build: *app
    profiles: [layout]
    restart: unless-stopped
    command:
      ["python", "-m", "tc49.dispatcher",
       "--broker", "broker:1883",
       "--railroad", "${TC49_RAILROAD:-gotthard}",
       "--store", "http://store:8765"]

  # No `--store`: the driver reads no documents. The railroad is named all
  # the same, because a container's log says which railroad it is driving.
  driver:
    build: *app
    profiles: [layout]
    restart: unless-stopped
    command:
      ["python", "-m", "tc49.driver",
       "--broker", "broker:1883",
       "--railroad", "${TC49_RAILROAD:-gotthard}"]

  # The layout interface: the one app bound to a railroad, and the writer of
  # what the hardware is asked to do. On the box wired to steel, so it is in
  # the `layout` profile with the store it reads.
  layout:
    build: *app
    profiles: [layout]
    restart: unless-stopped
    command:
      ["python", "-m", "tc49.layout",
       "--broker", "broker:1883",
       "--railroad", "${TC49_RAILROAD:-gotthard}",
       "--store", "http://store:8765"]

  # The simulator standing in for the steel, on a box that has none: the
  # milestone-1 binding of the same interface (ADR-0030). A profile of its
  # own, because it and `layout` are alternatives.
  simulator:
    build: *app
    profiles: [sim]
    restart: unless-stopped
    command:
      ["python", "-m", "tc49.simulator",
       "--broker", "broker:1883",
       "--railroad", "${TC49_RAILROAD:-gotthard}",
       "--store", "http://store:8765"]

  # The translator: the device vocabulary turned into the command station's
  # own language, over the mirror rather than the device (ADR-0043). Hardware
  # by what it talks to, so it comes up with the rest of the hardware and not
  # with the software — and it takes no railroad and no store, hardware
  # needing no layout (ADR-0059, decision 5).
  dccex:
    build: *app
    profiles: [hardware]
    restart: unless-stopped
    command:
      ["python", "-m", "tc49.dccex",
       "--broker", "broker:1883",
       "--station", "${TC49_STATION:-dccex-usb:2560}"]

  # JMRI, a third-party GUI appliance and none of this app's business: an
  # operator's DecoderPro and panel tool, reaching the same command station as a
  # plain client of 2560 (#196). Nothing of ours is in it and it owns no device.
  # The image does not start JMRI — a person clicks DecoderPro through noVNC on
  # 6901 — and `/home/jmri` is a volume because that is where the click that
  # points it at `dccex-usb` persists.
  jmri:
    image: jsa1987/jmri-docker:stable
    profiles: [hardware]
    # A fresh /tmp on every start. The image's websockify dials
    # `localhost:5901` while its `vncserver` takes the first display that has
    # no socket in /tmp/.X11-unix, and `docker restart` keeps the writable
    # layer — so each restart leaks a socket, burns a display, and moves the
    # VNC server one port away from the one noVNC connects to. The entrypoint
    # is upstream's and stays untouched (ADR-0043); this makes the leak
    # impossible instead.
    tmpfs:
      - /tmp
    restart: unless-stopped
    ports:
      - "6901:6901"
      - "5901:5901"
      - "12080:12080"
    volumes:
      - jmri:/home/jmri

volumes:
  acme:
  jmri:
  keys:
