# The layout box: the UI is built, so nginx serves `ui/dist` and the store is
# reached directly rather than through vite's proxy. `layout.rails49.org`
# holds the address the router has reserved for this machine.
#
# Every service here is a container and none is on the host (#354), so they
# are named by service and reached over compose's own DNS.

http:
  routers:
    layout-app:
      rule: "Host(`layout.rails49.org`)"
      entryPoints: [websecure]
      service: layout-app
      tls:
        certResolver: le

    layout-store:
      rule: "Host(`layout.rails49.org`) && (PathPrefix(`/backup`) || PathPrefix(`/drawings`) || PathPrefix(`/review`) || PathPrefix(`/layouts`) || PathPrefix(`/rosters`) || PathPrefix(`/catalogue`))"
      entryPoints: [websecure]
      service: layout-store
      tls:
        certResolver: le

    # The broker's WebSocket listener, on the app's own origin: a page served
    # over TLS cannot open a `ws://` socket, and the browser refuses it
    # outright rather than warning (#174). The run view is a client of the
    # broker (ADR-0059, decision 4). Anything native goes straight to 1883 and
    # does not come through here.
    layout-mqtt:
      rule: "Host(`layout.rails49.org`) && PathPrefix(`/mqtt`)"
      entryPoints: [websecure]
      service: layout-mqtt
      middlewares: [layout-mqtt-strip]
      tls:
        certResolver: le

  middlewares:
    layout-mqtt-strip:
      stripPrefix:
        prefixes: ["/mqtt"]

  services:
    layout-app:
      loadBalancer:
        servers:
          - url: "http://web:80"
    layout-store:
      loadBalancer:
        servers:
          - url: "http://store:8765"
    layout-mqtt:
      loadBalancer:
        servers:
          - url: "http://broker:9001"
