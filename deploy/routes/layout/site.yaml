# The layout box: the UI is built, so nginx serves `ui/dist` and the store is
# reached directly rather than through vite's proxy. `layout.rails49.org`
# holds the address the router has reserved for this machine.
#
# Every service here is a container and none is on the host (#354), so they
# are named by service and reached over compose's own DNS.

http:
  routers:
    layout-app:
      rule: "Host(`layout.rails49.org`)"
      entryPoints: [websecure]
      service: layout-app
      tls:
        certResolver: le

    layout-store:
      rule: "Host(`layout.rails49.org`) && (PathPrefix(`/backup`) || PathPrefix(`/drawings`) || PathPrefix(`/review`) || PathPrefix(`/layouts`) || PathPrefix(`/rosters`) || PathPrefix(`/catalogue`))"
      entryPoints: [websecure]
      service: layout-store
      tls:
        certResolver: le

    # The broker's WebSocket listener, on the app's own origin: a page served
    # over TLS cannot open a `ws://` socket, and the browser refuses it
    # outright rather than warning (#174). The run view is a client of the
    # broker (ADR-0059, decision 4). Anything native goes straight to 1883 and
    # does not come through here.
    layout-mqtt:
      rule: "Host(`layout.rails49.org`) && PathPrefix(`/mqtt`)"
      entryPoints: [websecure]
      service: layout-mqtt
      middlewares: [layout-mqtt-strip]
      tls:
        certResolver: le

    # A handshake from a page on another origin, refused before the upgrade.
    # A WebSocket has no preflight — the browser opens the socket whatever
    # the origin — so this is the whole of what stands between a page
    # somebody's browser visits and the gestures a client may publish
    # (ADR-0056, ADR-0059 decision 4). Mosquitto has no `Origin` setting, so
    # the rule is stated here rather than in an app; `lib/origin.py` is the
    # same rule at the store's face.
    #
    # `Origin` is written by the browser and a page cannot forge it. Matching
    # it at all is what selects this router, so a handshake carrying none —
    # a native client on 1883, which does not come through here anyway — does
    # not match and falls through to the one above: no header, no page. The
    # rule is longer than that one, and Traefik's default priority is the
    # rule's length, so this wins wherever both match.
    #
    # Scheme and port are loose because the router's own host is the whole
    # comparison, as it is at the store's face: TLS terminates here, and a
    # page on the app's own origin is the app (ADR-0042, ADR-0055).
    layout-mqtt-foreign:
      rule: 'Host(`layout.rails49.org`) && PathPrefix(`/mqtt`) && HeaderRegexp(`Origin`, `.`) && !HeaderRegexp(`Origin`, `^https?://layout\.rails49\.org(:[0-9]+)?$`)'
      entryPoints: [websecure]
      service: layout-mqtt
      middlewares: [layout-mqtt-refused]
      tls:
        certResolver: le

  middlewares:
    layout-mqtt-strip:
      stripPrefix:
        prefixes: ["/mqtt"]

    # 403, and no socket at all. Traefik has no middleware whose job is to
    # refuse, and this is the one that answers 403 without reaching the
    # service behind it: no source address is `255.255.255.255`, the limited
    # broadcast address, so every request routed here is refused. Refused
    # rather than served and then told: handing a foreign page a socket to
    # say it may not have one would be the decision undone.
    layout-mqtt-refused:
      ipAllowList:
        sourceRange: ["255.255.255.255/32"]

  services:
    layout-app:
      loadBalancer:
        servers:
          - url: "http://web:80"
    layout-store:
      loadBalancer:
        servers:
          - url: "http://store:8765"
    layout-mqtt:
      loadBalancer:
        servers:
          - url: "http://broker:9001"
