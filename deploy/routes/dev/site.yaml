# The dev box: vite serves the app and proxies the store's own routes, so the
# only backends here are vite on the host and the broker beside it.
# `dev.rails49.org` holds 127.0.0.1 unless `scripts/dns.sh` has been told
# otherwise.
#
# Priority is the rule's length, so the prefixed router wins over the bare host
# and neither of them needs one stated.

http:
  routers:
    dev-app:
      rule: "Host(`dev.rails49.org`)"
      entryPoints: [websecure]
      service: dev-app
      tls:
        certResolver: le

    # The broker's WebSocket listener, on the app's own origin: a page served
    # over TLS cannot open a `ws://` socket, and the browser refuses it
    # outright rather than warning (#174, ADR-0042). The run view is a client
    # of the broker (ADR-0059, decision 4) and builds this URL out of the
    # page's own, so development and the layout box are one path. Anything
    # native goes straight to 1883 and does not come through here.
    dev-mqtt:
      rule: "Host(`dev.rails49.org`) && PathPrefix(`/mqtt`)"
      entryPoints: [websecure]
      service: dev-mqtt
      middlewares: [dev-mqtt-strip]
      tls:
        certResolver: le

    # A handshake from a page on another origin, refused before the upgrade.
    # A WebSocket has no preflight — the browser opens the socket whatever
    # the origin — so this is the whole of what stands between a page
    # somebody's browser visits and the gestures a client may publish
    # (ADR-0056, ADR-0059 decision 4). Mosquitto has no `Origin` setting, so
    # the rule is stated here rather than in an app; `lib/origin.py` is the
    # same rule at the store's face.
    #
    # `Origin` is written by the browser and a page cannot forge it. Matching
    # it at all is what selects this router, so a handshake carrying none —
    # a native client, `mosquitto_sub`, the suite — does not match and falls
    # through to the one above, which is the rule's other half: no header, no
    # page. The rule is longer than that one, and Traefik's default priority
    # is the rule's length, so this wins wherever both match.
    #
    # Scheme and port are loose because the router's own host is the whole
    # comparison, as it is at the store's face: TLS terminates here, and a
    # page on the app's own origin is the app (ADR-0042, ADR-0055).
    dev-mqtt-foreign:
      rule: 'Host(`dev.rails49.org`) && PathPrefix(`/mqtt`) && HeaderRegexp(`Origin`, `.`) && !HeaderRegexp(`Origin`, `^https?://dev\.rails49\.org(:[0-9]+)?$`)'
      entryPoints: [websecure]
      service: dev-mqtt
      middlewares: [dev-mqtt-refused]
      tls:
        certResolver: le

  middlewares:
    dev-mqtt-strip:
      stripPrefix:
        prefixes: ["/mqtt"]

    # 403, and no socket at all. Traefik has no middleware whose job is to
    # refuse, and this is the one that answers 403 without reaching the
    # service behind it: no source address is `255.255.255.255`, the limited
    # broadcast address, so every request routed here is refused. Refused
    # rather than served and then told: handing a foreign page a socket to
    # say it may not have one would be the decision undone.
    dev-mqtt-refused:
      ipAllowList:
        sourceRange: ["255.255.255.255/32"]

  services:
    dev-app:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:5173"
    # On the host like vite, because `scripts/dev.sh` runs the broker as a
    # container of its own with its ports published rather than through
    # `deploy/compose.yaml`.
    dev-mqtt:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:9001"
