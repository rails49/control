# The `web` service's one server block, in place of the one nginx ships
# (#1123). The same root and index, and `index.html`, which nginx also serves
# for `/`, is sent with `no-cache` so a browser asks again on every load. The
# files under `assets/` are named by a hash of their contents and get nothing.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location = /index.html {
        add_header Cache-Control no-cache;
    }
}
