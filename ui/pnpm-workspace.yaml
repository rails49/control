allowBuilds:
  esbuild: true
# The native packages for linux on arm64 as well as this machine's, so the
# same node_modules runs vitest and vite inside implement-loop's sandbox.
supportedArchitectures:
  os: [current, linux]
  cpu: [current, arm64]
  libc: [current, glibc]
# Without a terminal, pnpm stops rather than replace a node_modules it did not
# lay out; an agent's shell has no terminal.
confirmModulesPurge: false
