[project]
name = "tc49"
version = "0.1.0"
description = "Scheduling, dispatching, and driving trains on a model railroad"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff",
    "black",
    "pyright",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tc49"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
src = ["src", "tests"]

[tool.black]
target-version = ["py312"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
