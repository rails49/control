# Single-Track Meet — the passing loop (docs/ARCHITECTURE.md,
# docs/bench/BENCHMARKS.md).
#
# Two single-track sections joined by a passing loop, with a two-track terminus
# at each end. Opposing trains must meet somewhere: each needs both single-track
# sections, so one has to stand in a loop track while the other runs past it.
# Which loop track, and which train waits, is the meet-pass decision — a launch
# choice under `Incremental` and a serialisation under `FullRoute`.
#
# Property-test railroad only, excluded from the benchmark set: its throughput
# story is the same one crossover-yard tells, faster.
#
#   west_1 ]===\                  /== loop_up ==\                  /===[ east_1
#               += w_main ========+              +======== e_main =+
#   west_2 ]===/                  \== loop_dn ==/                  \===[ east_2
#
# Drawn from real symbols (#56): all four junctions are plain turnouts, so each
# is one turnout symbol and takes its name from it. Transit names are authored
# on the leg each way takes, which is what carries the names the hand-written
# layout picked (#43) through being drawn.
#
# Nothing derives as `concurrent` here, because no two movements through any one
# of these connections are: a turnout's two roads share its toe, so every
# conflict is composed rather than authored (ADR-0006).
#
# The four terminus tracks are capped by terminal symbols, so each has one end
# in no connection and all four derive as terminal blocks.

drawing: single-track-meet
units: mm

symbols:
  west_1: {kind: block, length: 1200}
  west_2: {kind: block, length: 1200}
  w_main: {kind: block, length: 2400}
  loop_up: {kind: block, length: 1600}
  loop_dn: {kind: block, length: 1600}
  e_main: {kind: block, length: 2400}
  east_1: {kind: block, length: 1200}
  east_2: {kind: block, length: 1200}

  west_throat: # the two terminus tracks onto the single-track main
    kind: turnout
    names: {straight: from_1, diverging: from_2}

  west_switch: # the loop's west points
    kind: turnout
    names: {straight: to_up, diverging: to_dn}

  east_switch: # the loop's east points
    kind: turnout
    names: {straight: from_up, diverging: from_dn}

  east_throat: # the single-track main onto the two terminus tracks
    kind: turnout
    names: {straight: to_1, diverging: to_2}

  west_1_A_stop: {kind: terminal}
  west_2_A_stop: {kind: terminal}
  east_1_B_stop: {kind: terminal}
  east_2_B_stop: {kind: terminal}

wires:
  - [w_main.A, west_throat.toe]
  - [west_1.B, west_throat.straight]
  - [west_2.B, west_throat.diverging]
  - [w_main.B, west_switch.toe]
  - [loop_up.A, west_switch.straight]
  - [loop_dn.A, west_switch.diverging]
  - [e_main.A, east_switch.toe]
  - [loop_up.B, east_switch.straight]
  - [loop_dn.B, east_switch.diverging]
  - [e_main.B, east_throat.toe]
  - [east_1.A, east_throat.straight]
  - [east_2.A, east_throat.diverging]
  - [west_1.A, west_1_A_stop.P]
  - [west_2.A, west_2_A_stop.P]
  - [east_1.B, east_1_B_stop.P]
  - [east_2.B, east_2_B_stop.P]
