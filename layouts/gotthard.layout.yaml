# Gotthard — the railroad this project dispatches. Ticket #10, map #1.
#
# Transcribed from Gotthard.pdf (WinTrack) to the owner's description. Format
# per #5: named transits over `<block>.A|B` end-pairs, conflicts declared by
# INVERSION (every pair of transits at a connection conflicts unless listed
# `concurrent`), terminal blocks derived rather than declared.
#
# Three line sections join the two stations: two "blue" (one is drawn pink on
# the plan) and one "yellow". Because of the WX310 crossing, ALL THREE reach
# Airolo tracks 1-3 from either end, so Airolo is a single junction rather than
# two throats. At Claro the two blues meet the east end and the yellow the west.
#
# Everything not listed as a block below is connection: every turnout, the
# whole right-hand return loop, and both crossings. A connection can be metres
# of track — a train transits it but can never stop in it. Transit LENGTH is
# not modelled: every transit costs one tick regardless (#8), so the long
# return loop and a station ladder cost the same.

layout: gotthard
units: mm

# ASSUMED — lengths are read off the plan to the nearest track section and are
# used only for the admission fit check (does the train fit the destination).
blocks:
  # Claro through tracks
  claro_1: { length: 1500 }
  claro_2: { length: 1500 }
  claro_3: { length: 1500 }
  # Claro sidings, north-east: off the blue line, not off a station track
  claro_4: { length: 900 }
  claro_5: { length: 900 }
  # Claro sidings, south: off track 3
  claro_6: { length: 900 }
  claro_7: { length: 900 }

  # Airolo through tracks, and its siding
  airolo_1: { length: 1200 }
  airolo_2: { length: 1200 }
  airolo_3: { length: 1200 }
  airolo_4: { length: 700 }

  # The three line sections between the stations
  line_blue_1: { length: 3000 }
  line_blue_2: { length: 3000 }
  line_yellow: { length: 4000 }

connections:
  # Airolo — ONE junction. WX310 lets every line section reach every Airolo
  # track from either end, so both ends of tracks 1-3 belong here. A block end
  # lives in exactly one connection, which is why this cannot be split into a
  # north and a south throat.
  airolo:
    transits:
      blue_1_a1: [line_blue_1.B, airolo_1.A]
      blue_1_a2: [line_blue_1.B, airolo_2.A]
      blue_1_a3: [line_blue_1.B, airolo_3.A]
      blue_1_b1: [line_blue_1.B, airolo_1.B]
      blue_1_b2: [line_blue_1.B, airolo_2.B]
      blue_1_b3: [line_blue_1.B, airolo_3.B]
      blue_2_a1: [line_blue_2.B, airolo_1.A]
      blue_2_a2: [line_blue_2.B, airolo_2.A]
      blue_2_a3: [line_blue_2.B, airolo_3.A]
      blue_2_b1: [line_blue_2.B, airolo_1.B]
      blue_2_b2: [line_blue_2.B, airolo_2.B]
      blue_2_b3: [line_blue_2.B, airolo_3.B]
      yellow_a1: [line_yellow.A, airolo_1.A]
      yellow_a2: [line_yellow.A, airolo_2.A]
      yellow_a3: [line_yellow.A, airolo_3.A]
      yellow_b1: [line_yellow.A, airolo_1.B]
      yellow_b2: [line_yellow.A, airolo_2.B]
      yellow_b3: [line_yellow.A, airolo_3.B]
      siding_4: [airolo_1.B, airolo_4.A] # ASSUMED: airolo_4 trails off the B end
    # Nothing declared `concurrent`, so under inversion this junction is fully
    # exclusive: one movement at a time through the whole of Airolo. That is
    # certainly too strict for a station this size — the crossing and the two
    # throats are largely independent — but a missing declaration costs
    # throughput and never safety (#5). Relax it once the real geometry is known.

  # Claro west: the yellow line fans out to all three through tracks, and the
  # two south sidings trail off track 3.
  claro_west:
    transits:
      yellow_1: [line_yellow.B, claro_1.A]
      yellow_2: [line_yellow.B, claro_2.A]
      yellow_3: [line_yellow.B, claro_3.A]
      siding_6: [claro_3.A, claro_6.A] # ASSUMED: south sidings at the west end
      siding_7: [claro_3.A, claro_7.A]

  # Claro east: the two blue lines DIVIDE the station rather than both serving
  # all of it. Blue 1 reaches track 1 and the two north-east sidings; blue 2
  # reaches tracks 2 and 3. The sidings hang off the LINE, not off a track.
  #
  # This is what makes the yellow loop matter: track 1 is reachable from the
  # east only over blue 1, so a train for track 1 that finds blue 1 occupied
  # has no second eastern option — its alternative is the west end entirely.
  claro_east:
    transits:
      blue_1_1: [line_blue_1.A, claro_1.B]
      siding_4: [line_blue_1.A, claro_4.A]
      siding_5: [line_blue_1.A, claro_5.A]
      blue_2_2: [line_blue_2.A, claro_2.B]
      blue_2_3: [line_blue_2.A, claro_3.B]
