# crossover-yard — the cars this railroad owns and the trains made up from them
# (CONTEXT.md, **Roster**).
#
# The stock is synthetic: nobody owns one of these, so every train is a single
# car of the `bench-<length>` model of its length (`catalogue/`) rather than a
# product. A train's length is the sum of its cars and is never authored
# (ADR-0045); each sum is the length this file stated before the rewrite, train
# for train, so no benchmark result moves (#223).
#
# Being on the roster is what makes a train **known**; where it stands, if
# anywhere, is the run's and not this file's (ADR-0039). A scenario over this
# railroad places trains from here and states no length of its own, so one
# train has one length however many scenarios name it.
#
# `t1`..`t3` are the property suite's, which draws scenarios over the library
# railroads (tests/generate.py): one length that fits every block, so the fit
# check prunes nothing and the search pressure stays on interleaving.

roster: crossover-yard

cars:
  arriver_car: { model: bench-600 }
  express_2_car: { model: bench-600 }
  freight_car: { model: bench-600 }
  freight_1_car: { model: bench-1100 }
  hauler_car: { model: bench-600 }
  latecomer_car: { model: bench-600 }
  shunter_car: { model: bench-600 }
  shuttle_car: { model: bench-600 }
  t1_car: { model: bench-1400 }
  t2_car: { model: bench-1400 }
  t3_car: { model: bench-1400 }

trains:
  arriver: { cars: [{ car: arriver_car }] }
  express_2: { cars: [{ car: express_2_car }] }
  freight: { cars: [{ car: freight_car }] }
  freight_1: { cars: [{ car: freight_1_car }] }
  hauler: { cars: [{ car: hauler_car }] }
  latecomer: { cars: [{ car: latecomer_car }] }
  shunter: { cars: [{ car: shunter_car }] }
  shuttle: { cars: [{ car: shuttle_car }] }
  t1: { cars: [{ car: t1_car }] }
  t2: { cars: [{ car: t2_car }] }
  t3: { cars: [{ car: t3_car }] }
