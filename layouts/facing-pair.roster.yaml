# facing-pair — the trains this railroad owns (CONTEXT.md, **Roster**).
#
# A train is a name and a length. Being on the roster is what makes a train
# **known**; where it stands, if anywhere, is the run's and not this file's
# (ADR-0039). A scenario over this railroad places trains from here and states
# no length of its own, so one train has one length however many scenarios
# name it.
#
# `t1`..`t3` are the property suite's, which draws scenarios over the library
# railroads (tests/generate.py): one length that fits every block, so the fit
# check prunes nothing and the search pressure stays on interleaving.

roster: facing-pair

trains:
  t1: { length: 1000 }
  t2: { length: 1000 }
  t3: { length: 1000 }
