# Crossover Yard — the small railroad. Fast smoke benchmark (#8) and the only
# drawn railroad with a `concurrent` transit pair. Format per
# docs/store/DRAWING.md.
#
# Two parallel main lines joined by a double crossover (docs/image.png), with a
# terminal yard block at each end.
#
#     yard_w ]---+===  up_w  ===\ /===  up_e  ===+---[ yard_e
#                |               X               |
#                +===  dn_w  ===/ \===  dn_e  ===+
#
# Drawn from real symbols (#44): the scissors crossover is four turnouts and
# the crossing where its two diagonals meet, and each yard throat is one
# turnout. Nothing here declares concurrency — a turnout's two routes share its
# toe and a crossing's two share its frog, so every conflict below is composed
# rather than authored. What derives is the one pair that shares no symbol,
# `[up_straight, dn_straight]`, which is exactly what the hand-written layout
# declared. A concurrent crossing would also make the two diagonals concurrent,
# which is why the crossing is exclusive.
#
# Transit names are authored on the symbol transit each way takes, so the names
# the layout picked survive being drawn: the two west turnouts of the crossover
# name all four of its transits, since every way through it crosses one of
# them. The five symbols of the crossover say so with `connection`, which is
# what keeps the junction one connection named `crossover`; a throat is one
# symbol and takes its name from it.
#
# The outer yard ends are capped by terminal symbols, so yard_w.A and yard_e.B
# appear in no connection and both yard blocks derive as terminal.

drawing: crossover-yard
units: mm

# Drawn by hand (#57): the up line along row 0, the down line along row 3, the
# yard throats between them, and the diamond turned a quarter so that its two
# routes run steeply enough to meet the four diverging legs exactly. Every wire
# of the crossover is therefore of zero length; the ladders' are the diagonals
# the schematic draws as `|`. Geometry is decorative and cannot change what
# derives (docs/adr/0018), so this is the same railroad, drawn.

symbols:
  yard_w: {kind: block, length: 1400, at: [1, 1]}
  up_w: {kind: block, length: 3200, at: [5, 0]}
  up_e: {kind: block, length: 3200, at: [11, 0]}
  dn_w: {kind: block, length: 3200, at: [5, 3]}
  dn_e: {kind: block, length: 3200, at: [11, 3]}
  yard_e: {kind: block, length: 1400, at: [15, 1]}

  west_ladder: # yard throat, west end
    kind: turnout
    names: {straight: to_up, diverging: to_dn}
    at: [3, 1]
    flip: true
    rot: 180

  east_ladder: # yard throat, east end
    kind: turnout
    names: {straight: from_up, diverging: from_dn}
    at: [13, 1]
    rot: 180

  # The scissors crossover: a turnout on each main line at each end, and the
  # crossing where the two diagonals meet. Each turnout is turned so that its
  # diverging leg points into the middle, which is the whole of the drawing:
  # the four legs land on the diamond's four pins.
  up_w_points:
    kind: turnout
    connection: crossover
    names: {straight: up_straight, diverging: up_to_dn}
    at: [7, 0]
    flip: true
    rot: 180
  dn_w_points:
    kind: turnout
    connection: crossover
    names: {straight: dn_straight, diverging: dn_to_up}
    at: [7, 3]
  up_e_points: {kind: turnout, connection: crossover, at: [9, 0], rot: 180}
  dn_e_points: {kind: turnout, connection: crossover, at: [9, 3], flip: true}
  diamond: {kind: crossing, connection: crossover, at: [8, 1], rot: 90}

  yard_w_A_stop: {kind: terminal, at: [0, 1], rot: 180}
  yard_e_B_stop: {kind: terminal, at: [17, 1]}

wires:
  - [yard_w.B, west_ladder.toe]
  - [west_ladder.straight, up_w.A]
  - [west_ladder.diverging, dn_w.A]

  - [up_w.B, up_w_points.toe]
  - [dn_w.B, dn_w_points.toe]
  - [up_w_points.straight, up_e_points.straight]
  - [dn_w_points.straight, dn_e_points.straight]
  # Which end of a diamond route a leg takes is a drawing choice, not a
  # topological one: `b` joins the same two legs either way round. These are
  # the ends the quarter turn puts under them.
  - [up_w_points.diverging, diamond.a1]
  - [diamond.a2, dn_e_points.diverging]
  - [dn_w_points.diverging, diamond.b2]
  - [diamond.b1, up_e_points.diverging]
  - [up_e_points.toe, up_e.A]
  - [dn_e_points.toe, dn_e.A]

  - [up_e.B, east_ladder.straight]
  - [dn_e.B, east_ladder.diverging]
  - [east_ladder.toe, yard_e.A]

  - [yard_w.A, yard_w_A_stop.P]
  - [yard_e.B, yard_e_B_stop.P]
