# Single-Track Meet — the passing loop (docs/ARCHITECTURE.md, docs/BENCHMARKS.md).
#
# Two single-track sections joined by a passing loop, with a two-track terminus
# at each end. Opposing trains must meet somewhere: each needs both single-track
# sections, so one has to stand in a loop track while the other runs past it.
# Which loop track, and which train waits, is the meet-pass decision — a launch
# choice under `Incremental` and a serialisation under `FullRoute`.
#
# Property-test layout only, excluded from the benchmark set: its throughput
# story is the same one crossover-yard tells, faster.
#
#   west_1 ]===\                  /== loop_up ==\                  /===[ east_1
#               += w_main ========+              +======== e_main =+
#   west_2 ]===/                  \== loop_dn ==/                  \===[ east_2
#
# west_1.A, west_2.A, east_1.B and east_2.B appear in no connection, so all
# four terminus tracks are terminal blocks.

layout: single-track-meet
units: mm

blocks:
  west_1: { length: 1200 }
  west_2: { length: 1200 }
  w_main: { length: 2400 }
  loop_up: { length: 1600 }
  loop_dn: { length: 1600 }
  e_main: { length: 2400 }
  east_1: { length: 1200 }
  east_2: { length: 1200 }

# Conflicts are declared by inversion (ADR-0006): nothing is `concurrent` here,
# because no two movements through any one of these connections are — each
# throat funnels into a single block, and the loop switches are plain turnouts.
connections:
  west_throat: # turnout: the two terminus tracks onto the single-track main
    transits:
      from_1: [west_1.B, w_main.A]
      from_2: [west_2.B, w_main.A]

  west_switch: # turnout: the loop's west points
    transits:
      to_up: [w_main.B, loop_up.A]
      to_dn: [w_main.B, loop_dn.A]

  east_switch: # turnout: the loop's east points
    transits:
      from_up: [loop_up.B, e_main.A]
      from_dn: [loop_dn.B, e_main.A]

  east_throat: # turnout: the single-track main onto the two terminus tracks
    transits:
      to_1: [e_main.B, east_1.A]
      to_2: [e_main.B, east_2.A]
