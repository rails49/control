# Gotthard — the railroad this project dispatches. Ticket #10, map #1.
#
# Checked against the owner's Rocrail netlist, `gotthard-rocrail.xml` (rendered
# as `gotthard-rocrail.png`), which is authoritative for topology; Gotthard.pdf
# (WinTrack) remains the source for block lengths.
#
# Converted mechanically from the hand-written layout (#43), then refined one
# junction at a time until every junction was drawn: Airolo and Claro west
# (#46), then Claro east (#58, settling #35). All three are named for the
# switches they are in the netlist, so their concurrency is composed rather
# than declared, and the panel can show turnout detail everywhere.
#
# Symbol names are Rocrail's switch ids, which is what ties a drawn turnout
# back to the netlist and, later, to its decoder address.
#
# Block ids map 1:1 onto Rocrail's, which uses shorter names:
#   claro_1..3 = c1..c3      claro_4, claro_5 = c6, c5   claro_6, claro_7 = c7, c8
#   airolo_1..4 = a1..a4     line_blue_1, line_blue_2 = b1, b2
#   line_yellow = bk1        (Rocrail's stale route ids still call bk1 `rw`)
#
# Three line sections join the two stations: two "blue" (one is drawn pink on
# the plan) and one "yellow". Because of the WX310 crossing, ALL THREE reach
# Airolo tracks 1-3 from either end, so Airolo is a single junction rather than
# two throats. At Claro the two blues meet the east end and the yellow the west.
#
# Everything not a block symbol below is connection: every turnout, the WX310,
# and the whole right-hand return loop. A connection can be metres of track — a
# train transits it but can never stop in it. Transit LENGTH is not modelled:
# every transit costs one tick regardless (#8), so the long return loop and a
# station ladder cost the same.
#
# How the wires below run, since the editor rewrites that list whole and any
# comment inside it would be lost on the first save (docs/store/DRAWING.md):
#
#   Airolo, upper route: blue 2 in, over the WX310, out along the west ladder.
#   Airolo, lower route: the yellow and blue 1 meet at sw51 and run east.
#   Airolo, round the loop and back down the east ladder into the B ends.
#   Claro west: the ladder off the yellow, then the sidings off track 3.
#   Claro east: blue 1 down to sw50, then blue 2 down to sw49 and the sidings.

drawing: gotthard
units: mm

symbols:
  # ASSUMED — lengths are read off the plan to the nearest track section and are
  # used only for the admission fit check (does the train fit the destination).

  # Claro through tracks
  claro_1: {kind: block, length: 1500}
  claro_2: {kind: block, length: 1500}
  claro_3: {kind: block, length: 1500}
  # Claro sidings, north-east: off track 1's east lead (Rocrail c6, c5)
  claro_4: {kind: block, length: 900}
  claro_5: {kind: block, length: 900}
  # Claro sidings, south-west: off track 3's west lead (Rocrail c7, c8)
  claro_6: {kind: block, length: 900}
  claro_7: {kind: block, length: 900}

  # Airolo through tracks, and its siding
  airolo_1: {kind: block, length: 1200}
  airolo_2: {kind: block, length: 1200}
  airolo_3: {kind: block, length: 1200}
  airolo_4: {kind: block, length: 700}

  # The three line sections between the stations
  line_blue_1: {kind: block, length: 3000}
  line_blue_2: {kind: block, length: 3000}
  line_yellow: {kind: block, length: 4000}

  # Airolo — ONE junction, drawn from its real geometry (#46), which is the
  # owner's account on #35 read back off the netlist's track tiles. The WX310
  # lets every line section reach every Airolo track from either end, so both
  # ends of tracks 1-3 belong here. A block end lives in exactly one
  # connection, which is why this cannot be split into a north and a south
  # throat.
  #
  # Two legs, with a scissors crossover between them:
  #
  #   line_blue_2 ==  sw17 ====\ /==== sw18  == sw41/sw42 ladder == tracks 1-3 A
  #                             X  (WX310)
  #   yellow/blue_1 = sw19 ====/ \==== sw20  == return loop ======= tracks 1-3 B
  #                                                    == sw35/sw36/sw39 ladder
  #
  # Set straight the WX310 passes two trains at once, one per leg: blue 2 to
  # the A ends while the yellow or blue 1 works the B ends. Set crossed it
  # passes one, exclusively. Nothing below declares that. A turnout's two ways
  # share its toe and the crossing's share its frog, so composition (DRAWING.md)
  # yields 18 pairs, blue 2 to any A end against the yellow or blue 1 to any B
  # end. Fifteen more come from the siding, which touches sw39 alone.
  #
  # `siding_4` keeps its hand-picked name, sw39's straight leg being the whole
  # of it. The other 18 each take two symbols to identify, an origin turnout
  # and a ladder leg, and one way through cannot carry two authored names, so
  # they take the derived name: their two block ends.

  # The WX310, west of the station: a turnout on each leg at each end, and the
  # crossing where the two diagonals meet. Rocrail hops the yellow's lead over
  # blue 2's on connector tiles rather than crossing it, and #35 has those two
  # movements running together, so there is no second crossing here.
  sw17: {kind: turnout, connection: airolo} # blue 2: on, or cross down
  sw18: {kind: turnout, connection: airolo} # A ends: on, or cross down
  sw19: {kind: turnout, connection: airolo} # yellow/blue 1: on, or cross up
  sw20: {kind: turnout, connection: airolo} # B ends: on, or cross up
  sw16: {kind: crossing, connection: airolo} # the WX310 itself

  # Where the lower leg splits: the yellow runs on west, blue 1 turns south.
  sw51: {kind: turnout, connection: airolo}

  # The west ladder, fanning the upper leg into the A ends of tracks 1-3.
  sw41: {kind: turnout, connection: airolo}
  sw42: {kind: turnout, connection: airolo}

  # The return loop off the east end: single track, so a bend rather than a
  # junction, and what puts the B ends on the lower leg.
  return_loop: {kind: pin}

  # The east ladder. sw39 sits on track 3's own lead, so the siding is its
  # straight leg and the ladder its diverging one.
  sw35: {kind: turnout, connection: airolo}
  sw36: {kind: turnout, connection: airolo}
  sw39:
    kind: turnout
    connection: airolo
    names: {straight: siding_4} # a4 trails off a3, per the Rocrail netlist

  # Claro west, drawn from real symbols (#46): the yellow line fans out to all
  # three through tracks down a ladder, and the two south sidings trail off
  # track 3's west lead. One symbol transit identifies each way through, so all
  # five keep the names the hand-written layout gave them.
  #
  # Composition adds the pairs the ladder always allowed: shunting between
  # track 3 and a siding shares no switch with the yellow reaching track 1 or
  # track 2.
  sw24:
    kind: turnout
    connection: claro_west
    names: {straight: yellow_1}
  sw46:
    kind: turnout
    connection: claro_west
    names: {straight: yellow_2}
  # ASSUMED, and the one thing here the tiles do not settle: sw44's point faces
  # track 3, so the sidings are reachable from it. Facing the other way they
  # would hang off the yellow instead — which is the mirror of what #35 found
  # at claro_east, so the hedge stays until someone checks the real switch.
  sw44:
    kind: turnout
    connection: claro_west
    names: {straight: yellow_3}
  sw45:
    kind: turnout
    connection: claro_west
    names: {straight: siding_6, diverging: siding_7}

  # Claro east, drawn from real symbols (#58): the two blue lines DIVIDE the
  # station rather than both serving all of it. Blue 1 reaches tracks 2 and 3;
  # blue 2 reaches track 1 and, past it, the two north-east sidings.
  #
  # This is what makes the yellow loop matter: tracks 2 and 3 are reachable
  # from the east only over blue 1, so a train for track 3 that finds blue 1
  # occupied has no second eastern option — its alternative is the west end
  # entirely.
  #
  # This settles #35, and it is a topology change rather than a drawing one.
  # The hand-written layout ran blue 2 to tracks 1 and 2 and hung the sidings
  # off track 1's east lead; the netlist's track tiles say otherwise, and the
  # tiles are what this file is checked against (see the header). Traced:
  #
  #   b1 (19,7) east to (32,7), down the x=33 line to (33,15), then west and
  #     down to (32,16) and into sw50 (31,16) from the east. sw50 is `left`,
  #     so its roads run west to c2 and south to (31,17) and west to c3.
  #   b2 (19,8) east to (30,8), down the x=31 line to (31,15), then west into
  #     sw49 (27,15) from the east. sw49 is `right`, so its roads run west to
  #     c1 and north to (27,14), then west into sw48 (23,14) from the east.
  #     sw48 is `right`: west to c5, north to (23,13) and west to c6.
  #
  # Two consequences. `blue_2_2` does not exist and `blue_1_2` does; and the
  # sidings hang off blue 2's lead, not off claro_1.B, so their transits run
  # from line_blue_2.A. The names the layout picked survive on the legs that
  # still carry them.
  #
  # And it is TWO connections, not one. The two leads share no track: sw50 sits
  # on blue 1's, sw49 and sw48 on blue 2's, and the two run parallel from
  # Airolo without meeting. A junction is what derivation finds, not what a
  # generic symbol asserts, so the one opaque box splits into the two throats
  # it always was — named for Rocrail's block ids for the two lines, `b1` and
  # `b2`, which the header maps.
  #
  # That is also what ends this junction's blanket exclusivity, which it had
  # only because a symbol declaring nothing is exclusive (ADR-0006). Blue 1
  # working track 2 or 3 and blue 2 working track 1 or a siding are now
  # different connections and never conflict at all.
  sw50: # blue 1's lead: tracks 2 and 3
    kind: turnout
    connection: claro_east_b1
    names: {straight: blue_1_2, diverging: blue_1_3}
  sw49: # blue 2's lead: track 1, or on to the sidings
    kind: turnout
    connection: claro_east_b2
    names: {straight: blue_2_1}
  sw48: # the north-east siding pair, off sw49's diverging leg
    kind: turnout
    connection: claro_east_b2
    names: {straight: siding_5, diverging: siding_4}

  # The far end of every siding is a deliberate track end, so it takes a
  # terminal symbol; those five blocks are what derives as terminal.
  claro_4_B_stop: {kind: terminal}
  claro_5_B_stop: {kind: terminal}
  claro_6_B_stop: {kind: terminal}
  claro_7_B_stop: {kind: terminal}
  airolo_4_B_stop: {kind: terminal}

wires:
  - [line_blue_2.B, sw17.toe]
  - [sw17.straight, sw18.straight]
  - [sw17.diverging, sw16.a1]
  - [sw16.a2, sw20.diverging]
  - [sw19.diverging, sw16.b1]
  - [sw16.b2, sw18.diverging]
  - [sw18.toe, sw41.toe]
  - [sw41.straight, airolo_1.A]
  - [sw41.diverging, sw42.toe]
  - [sw42.straight, airolo_2.A]
  - [sw42.diverging, airolo_3.A]

  - [line_yellow.A, sw51.straight]
  - [line_blue_1.B, sw51.diverging]
  - [sw51.toe, sw19.toe]
  - [sw19.straight, sw20.straight]

  - [sw20.toe, return_loop.P]
  - [return_loop.P, sw35.toe]
  - [sw35.straight, airolo_1.B]
  - [sw35.diverging, sw36.toe]
  - [sw36.straight, airolo_2.B]
  - [sw36.diverging, sw39.diverging]
  - [sw39.toe, airolo_3.B]
  - [sw39.straight, airolo_4.A]

  - [line_yellow.B, sw24.toe]
  - [sw24.straight, claro_1.A]
  - [sw24.diverging, sw46.toe]
  - [sw46.straight, claro_2.A]
  - [sw46.diverging, sw44.straight]
  - [sw44.toe, claro_3.A]
  - [sw44.diverging, sw45.toe]
  - [sw45.straight, claro_6.A]
  - [sw45.diverging, claro_7.A]

  - [line_blue_1.A, sw50.toe]
  - [sw50.straight, claro_2.B]
  - [sw50.diverging, claro_3.B]

  - [line_blue_2.A, sw49.toe]
  - [sw49.straight, claro_1.B]
  - [sw49.diverging, sw48.toe]
  - [sw48.straight, claro_5.A]
  - [sw48.diverging, claro_4.A]

  - [claro_4.B, claro_4_B_stop.P]
  - [claro_5.B, claro_5_B_stop.P]
  - [claro_6.B, claro_6_B_stop.P]
  - [claro_7.B, claro_7_B_stop.P]
  - [airolo_4.B, airolo_4_B_stop.P]
