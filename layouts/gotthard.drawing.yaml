# Gotthard — the railroad this project dispatches. Ticket #10, map #1.
#
# Checked against the owner's Rocrail netlist, `gotthard-rocrail.xml` (rendered
# as `gotthard-rocrail.png`), which is authoritative for topology; Gotthard.pdf
# (WinTrack) remains the source for block lengths.
#
# Converted mechanically from the hand-written layout (#43), so each junction
# is one generic connection symbol: its pins are the block ends it holds, and
# its transits and their names pass through unchanged. None of the real
# geometry is drawn yet — the turnouts and both crossings arrive one junction
# at a time with the symbol library (#44) — so the panel shows no turnout
# detail here.
#
# Block ids map 1:1 onto Rocrail's, which uses shorter names:
#   claro_1..3 = c1..c3      claro_4, claro_5 = c6, c5   claro_6, claro_7 = c7, c8
#   airolo_1..4 = a1..a4     line_blue_1, line_blue_2 = b1, b2
#   line_yellow = bk1        (Rocrail's stale route ids still call bk1 `rw`)
#
# Three line sections join the two stations: two "blue" (one is drawn pink on
# the plan) and one "yellow". Because of the WX310 crossing, ALL THREE reach
# Airolo tracks 1-3 from either end, so Airolo is a single junction rather than
# two throats. At Claro the two blues meet the east end and the yellow the west.
#
# Everything not a block symbol below is connection: every turnout, the whole
# right-hand return loop, and both crossings. A connection can be metres of
# track — a train transits it but can never stop in it. Transit LENGTH is not
# modelled: every transit costs one tick regardless (#8), so the long return
# loop and a station ladder cost the same.

drawing: gotthard
units: mm

symbols:
  # ASSUMED — lengths are read off the plan to the nearest track section and are
  # used only for the admission fit check (does the train fit the destination).

  # Claro through tracks
  claro_1: {kind: block, length: 1500}
  claro_2: {kind: block, length: 1500}
  claro_3: {kind: block, length: 1500}
  # Claro sidings, north-east: off track 1's east lead (Rocrail c6, c5)
  claro_4: {kind: block, length: 900}
  claro_5: {kind: block, length: 900}
  # Claro sidings, south-west: off track 3's west lead (Rocrail c7, c8)
  claro_6: {kind: block, length: 900}
  claro_7: {kind: block, length: 900}

  # Airolo through tracks, and its siding
  airolo_1: {kind: block, length: 1200}
  airolo_2: {kind: block, length: 1200}
  airolo_3: {kind: block, length: 1200}
  airolo_4: {kind: block, length: 700}

  # The three line sections between the stations
  line_blue_1: {kind: block, length: 3000}
  line_blue_2: {kind: block, length: 3000}
  line_yellow: {kind: block, length: 4000}

  # Airolo — ONE junction. WX310 lets every line section reach every Airolo
  # track from either end, so both ends of tracks 1-3 belong here. A block end
  # lives in exactly one connection, which is why this cannot be split into a
  # north and a south throat.
  #
  # Nothing declared `concurrent`, so under inversion (ADR-0006) this junction
  # is fully exclusive: one movement at a time through the whole of Airolo.
  # That is certainly too strict for a station this size — the crossing and the
  # two throats are largely independent — but a missing declaration costs
  # throughput and never safety (#5). Drawing the real geometry (#44) is what
  # relaxes it: composition then reads the concurrency off the symbols instead
  # of anyone declaring it here.
  airolo:
    kind: connection
    pins:
      [
        airolo_1_A, airolo_1_B, airolo_2_A, airolo_2_B, airolo_3_A, airolo_3_B,
        airolo_4_A, line_blue_1_B, line_blue_2_B, line_yellow_A,
      ]
    transits:
      blue_1_a1: [line_blue_1_B, airolo_1_A]
      blue_1_a2: [line_blue_1_B, airolo_2_A]
      blue_1_a3: [line_blue_1_B, airolo_3_A]
      blue_1_b1: [line_blue_1_B, airolo_1_B]
      blue_1_b2: [line_blue_1_B, airolo_2_B]
      blue_1_b3: [line_blue_1_B, airolo_3_B]
      blue_2_a1: [line_blue_2_B, airolo_1_A]
      blue_2_a2: [line_blue_2_B, airolo_2_A]
      blue_2_a3: [line_blue_2_B, airolo_3_A]
      blue_2_b1: [line_blue_2_B, airolo_1_B]
      blue_2_b2: [line_blue_2_B, airolo_2_B]
      blue_2_b3: [line_blue_2_B, airolo_3_B]
      yellow_a1: [line_yellow_A, airolo_1_A]
      yellow_a2: [line_yellow_A, airolo_2_A]
      yellow_a3: [line_yellow_A, airolo_3_A]
      yellow_b1: [line_yellow_A, airolo_1_B]
      yellow_b2: [line_yellow_A, airolo_2_B]
      yellow_b3: [line_yellow_A, airolo_3_B]
      siding_4: [airolo_3_B, airolo_4_A] # a4 trails off a3, per the Rocrail netlist

  # Claro west: the yellow line fans out to all three through tracks, and the
  # two south sidings trail off track 3.
  claro_west:
    kind: connection
    pins: [claro_1_A, claro_2_A, claro_3_A, claro_6_A, claro_7_A, line_yellow_B]
    transits:
      yellow_1: [line_yellow_B, claro_1_A]
      yellow_2: [line_yellow_B, claro_2_A]
      yellow_3: [line_yellow_B, claro_3_A]
      siding_6: [claro_3_A, claro_6_A] # ASSUMED: south sidings at the west end
      siding_7: [claro_3_A, claro_7_A]

  # Claro east: the two blue lines DIVIDE the station rather than both serving
  # all of it. Per the Rocrail netlist, blue 1 reaches track 3 alone and blue 2
  # reaches tracks 1 and 2. The two north-east sidings hang off TRACK 1's east
  # lead, not off the line: the netlist gives them no route to a blue.
  #
  # This is what makes the yellow loop matter: track 3 is reachable from the
  # east only over blue 1, so a train for track 3 that finds blue 1 occupied
  # has no second eastern option — its alternative is the west end entirely.
  claro_east:
    kind: connection
    pins:
      [
        claro_1_B, claro_2_B, claro_3_B, claro_4_A, claro_5_A, line_blue_1_A,
        line_blue_2_A,
      ]
    transits:
      blue_1_3: [line_blue_1_A, claro_3_B]
      blue_2_1: [line_blue_2_A, claro_1_B]
      blue_2_2: [line_blue_2_A, claro_2_B]
      siding_4: [claro_1_B, claro_4_A]
      siding_5: [claro_1_B, claro_5_A]

  # The far end of every siding is a deliberate track end, so it takes a
  # terminal symbol; those five blocks are what derives as terminal.
  claro_4_B_stop: {kind: terminal}
  claro_5_B_stop: {kind: terminal}
  claro_6_B_stop: {kind: terminal}
  claro_7_B_stop: {kind: terminal}
  airolo_4_B_stop: {kind: terminal}

wires:
  - [airolo_1.A, airolo.airolo_1_A]
  - [airolo_1.B, airolo.airolo_1_B]
  - [airolo_2.A, airolo.airolo_2_A]
  - [airolo_2.B, airolo.airolo_2_B]
  - [airolo_3.A, airolo.airolo_3_A]
  - [airolo_3.B, airolo.airolo_3_B]
  - [airolo_4.A, airolo.airolo_4_A]
  - [line_blue_1.B, airolo.line_blue_1_B]
  - [line_blue_2.B, airolo.line_blue_2_B]
  - [line_yellow.A, airolo.line_yellow_A]
  - [claro_1.A, claro_west.claro_1_A]
  - [claro_2.A, claro_west.claro_2_A]
  - [claro_3.A, claro_west.claro_3_A]
  - [claro_6.A, claro_west.claro_6_A]
  - [claro_7.A, claro_west.claro_7_A]
  - [line_yellow.B, claro_west.line_yellow_B]
  - [claro_1.B, claro_east.claro_1_B]
  - [claro_2.B, claro_east.claro_2_B]
  - [claro_3.B, claro_east.claro_3_B]
  - [claro_4.A, claro_east.claro_4_A]
  - [claro_5.A, claro_east.claro_5_A]
  - [line_blue_1.A, claro_east.line_blue_1_A]
  - [line_blue_2.A, claro_east.line_blue_2_A]
  - [claro_4.B, claro_4_B_stop.P]
  - [claro_5.B, claro_5_B_stop.P]
  - [claro_6.B, claro_6_B_stop.P]
  - [claro_7.B, claro_7_B_stop.P]
  - [airolo_4.B, airolo_4_B_stop.P]
