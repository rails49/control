name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      CI: "true"
      # The link check reads other rails49 repositories through the REST API.
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        if: hashFiles('pyproject.toml') != ''
      - run: uv sync
        if: hashFiles('pyproject.toml') != ''
      # The ui carries its own toolchain under ui/ (scripts/check.sh).
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile --dir ui
      # The broker the MQTT binding's suite runs against (#369). The install
      # may still fail, but the absence is loud: `CI` is set above, and under
      # it the `broker` fixture fails rather than skips (rails49_testing.broker), so
      # a package index having a bad day reddens the gate here (#423). One
      # that hangs is cut off rather than held for six hours (#947). The
      # packages come from a cache keyed on the runner image, and a hit makes
      # no network request (#1214).
      - name: cache key, from the runner image
        id: image
        run: echo "key=mosquitto-$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"
      - name: mosquitto packages, restored
        id: debs
        uses: actions/cache/restore@v4
        with:
          path: ~/mosquitto-debs/*.deb
          key: ${{ steps.image.outputs.key }}
      - name: mosquitto
        id: mosquitto
        continue-on-error: true
        timeout-minutes: 5
        env:
          HIT: ${{ steps.debs.outputs.cache-hit }}
        run: |
          if [ "$HIT" != true ]; then
            mkdir -p ~/mosquitto-debs/partial
            sudo apt-get update
            sudo apt-get install -y --download-only -o Dir::Cache::archives="$HOME/mosquitto-debs" mosquitto
          fi
          sudo dpkg -i ~/mosquitto-debs/*.deb
      - name: mosquitto packages, saved
        if: steps.debs.outputs.cache-hit != 'true' && steps.mosquitto.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: ~/mosquitto-debs/*.deb
          key: ${{ steps.image.outputs.key }}
      - name: gate
        run: |
          cmd=$(sed -n 's/^ci:[[:space:]]*//p' CLAUDE.md 2>/dev/null | head -1)
          [ -n "$cmd" ] || cmd=$(sed -n 's/^[Gg]ate:[[:space:]]*//p' CLAUDE.md 2>/dev/null | head -1)
          [ -n "$cmd" ] || { [ -x scripts/check.sh ] && cmd=./scripts/check.sh; }
          [ -n "$cmd" ] || { grep -qE '^check:' Makefile 2>/dev/null && cmd="make check"; }
          [ -n "$cmd" ] || { echo "no ci:/gate: line in CLAUDE.md, no scripts/check.sh, no make check"; exit 1; }
          echo "+ $cmd"
          bash -c "$cmd"
