name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        if: hashFiles('pyproject.toml') != ''
      - run: uv sync
        if: hashFiles('pyproject.toml') != ''
      # The ui carries its own toolchain under ui/ (scripts/check.sh).
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile --dir ui
      # The broker the MQTT binding's suite runs against (#369). Those tests
      # skip where there is no mosquitto, so a package index having a bad day
      # costs coverage and never a red gate.
      - name: mosquitto
        continue-on-error: true
        run: sudo apt-get update && sudo apt-get install -y mosquitto
      - name: gate
        run: |
          cmd=$(sed -n 's/^ci:[[:space:]]*//p' CLAUDE.md 2>/dev/null | head -1)
          [ -n "$cmd" ] || cmd=$(sed -n 's/^[Gg]ate:[[:space:]]*//p' CLAUDE.md 2>/dev/null | head -1)
          [ -n "$cmd" ] || { [ -x scripts/check.sh ] && cmd=./scripts/check.sh; }
          [ -n "$cmd" ] || { grep -qE '^check:' Makefile 2>/dev/null && cmd="make check"; }
          [ -n "$cmd" ] || { echo "no ci:/gate: line in CLAUDE.md, no scripts/check.sh, no make check"; exit 1; }
          echo "+ $cmd"
          bash -c "$cmd"
