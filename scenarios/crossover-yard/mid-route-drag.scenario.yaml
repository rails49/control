# crossover-yard/mid-route-drag — the round trip a person performs (#135).
#
# An operator sends a train to the far yard, changes their mind while it is
# under way, and drags it back. A drag on a moving train is not a preemption:
# a train under way is committed to the transit it has been granted, so the
# working queues behind the one in flight and means "finish what you are
# doing, then go there".
#
# `from: dn_w.B` is what a panel composes at boundary 2 — correct for the
# block freight stands in then, and meaningless for yard_e, which is where the
# working will actually launch from. Nobody can state that end at drag time:
# the origin is a dispatcher choice not yet made. The dispatcher supplies it
# from the route the train arrives on, and because yard_e is a terminal block
# the pass-through rule alone would face the train at the wall — it is
# yard_e.A, the one end the train can leave by (#145).
#
# What the run shows that `rejection` shows for a refusal: two completions and
# no rejection anywhere in the trace. Before #135 the same drag was admitted
# and then answered `wrong_origin` at the launch stage — honest, and still not
# the working the operator asked for.

scenario: mid-route-drag
layout: crossover-yard

trains:
  freight: { at: yard_w, facing: B }

requests:
  # Out over the down main, which the lexicographic tie-break prefers.
  - { train: freight, from: yard_w.B, to: [yard_e.A], at: 0 }
  # The drag, released while freight is standing in dn_w.
  - { train: freight, from: dn_w.B, to: [yard_w.B], at: 2 }
