# crossover-yard/rejection — work the run never attempts (#30, review follow-up).
#
# A rejected request is not a stall and not a completion. It is the run being
# told to do something impossible, saying so, and moving on. That matters to
# the numbers in a way worth pinning: dropping a request makes the makespan
# SHORTER, so a run that quietly rejected half its workload would outscore one
# that did all of it. `metrics()` therefore reports `status: rejected`, and the
# comparison table names every dropped request.
#
# `shunter` asks to leave through yard_w.A — the outer end of a terminal block,
# which appears in no connection, so no route out of it can exist. The arrival
# end is fine, so the request survives fit and entry and dies on reachability:
# the train is idle, nothing of its own is queued ahead of it, so the origin is
# known where the request arrives and it is rejected `unreachable` there (#135)
# rather than later at the first launch attempt.
#
# It is placed facing B, the one end it could leave by, because a placement
# facing a wall is refused at load (#145). The request states its own
# departure end and keeps the freedom to name the wall: facing is a scheduler
# discipline, not a system invariant (ADR-0019).
#
# `hauler` runs normally alongside it, so the trace carries a completion as
# well as a rejection and the two are visibly different outcomes.

scenario: rejection
layout: crossover-yard

trains:
  shunter: { at: yard_w, facing: A-to-B }
  hauler: { at: up_e, facing: A-to-B }

requests:
  - { train: shunter, from: yard_w.A, to: [dn_e.A] }
  - { train: hauler, from: up_e.B, to: [yard_e.A] }
