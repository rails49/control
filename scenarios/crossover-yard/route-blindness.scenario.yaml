# crossover-yard/route-blindness — the differential's committed counterexample
# (#28, property 3), shrunk by Hypothesis; now the regression fixture for
# congestion-aware costing (#33), which fixed it.
#
# ARCHITECTURE.md first stated the differential as "`Incremental` completes
# every request set `FullRoute` completes, in no more boundaries". This scenario
# falsified the count half, on two trains and two requests, with no idle
# obstacle and no starvation anywhere: both strategies completed both
# requests, and `FullRoute` was a boundary FASTER.
#
# The mechanism was that incremental locking hid contention from route
# selection. `FullRoute` locked t1's whole route up front, so when t2
# launched its first candidate — over the crossover into dn_e, both
# candidates tying at two transits and dn_e lexicographically first — that
# candidate was visibly blocked, and t2 fell through to the up line. The two
# trains then ran on separate lines and both finished at boundary 3.
# `Incremental` locked only t1's first increment, so dn_e still looked free
# when t2
# launched; t2 committed to dn_e, t1 was refused `held` on dn_e, waited, and
# finished at boundary 4. Locking a whole route up front is not merely
# conservative: it is INFORMATIVE, and it was the information the next
# launch's route choice ran on.
#
# Congestion-aware costing (#33) feeds committed routes into the route
# ordering directly (DISPATCH.md, route selection), so t1 across dn_e demotes
# t2's crossover candidate under both strategies: t2 takes the up line at its
# first candidate, and both strategies finish at boundary 3. Asserted exactly in
# test_incremental.py. Nothing here was ever a safety defect; both strategies
# stay deadlock-free throughout.

scenario: route-blindness
layout: crossover-yard

trains:
  t1: { length: 1400, at: yard_w, facing: B }
  t2: { length: 1400, at: up_w, facing: B }

requests:
  # t1 heads for the down main; its only 2-transit route runs through dn_e.
  - { train: t1, from: yard_w.B, to: [dn_e.A], at: 0 }
  # t2 heads for the east yard, reachable over either main. Its candidates tie
  # at two transits; t1's committed route congests dn_e, so costing puts the
  # up line first — before #33, the lexicographic tie-break put dn_e first,
  # straight across t1's path.
  - { train: t2, from: up_w.B, to: [yard_e.A], at: 0 }
