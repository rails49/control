# gotthard-v0/saturation — the headline workload (docs/BENCHMARKS.md, #31).
#
# Five trains, three workings each, every request in at the start. Batch arrivals
# make makespan the drain time and contention maximal, which is where the two
# locking strategies are supposed to separate.
#
# Five is the ceiling, per BENCHMARKS.md's axis note: Gotthard has six station
# tracks, and at six every arrival block would be a permanent obstacle at
# the start. At five there is exactly one free track, so the whole workload is
# a rotation — each train moves into the slot the train ahead of it has just
# vacated, and the free slot travels round the six tracks three times. Nothing drains except by
# rotation, which is what makes this saturation rather than merely traffic.
#
# The workings are line workings, claro <-> airolo, chained: request n+1 departs
# from wherever request n parked the train, so only a train's first working
# states a departure block and the rest state only an end.
#
# `|dest| = 2` throughout — one track, either way round, BENCHMARKS.md's
# continuity point and the column every other is read against. Before
# congestion-aware costing (#33) it was also what kept the run alive at the
# default `k = 2`: at `|dest| = 6` every train tried claro_1 then claro_2 and
# nothing else — the lexicographic bias BENCHMARKS.md predicted — and the run
# stalled outright at once. Costing removed that bias and carried the
# rotation to 11 of 15 workings; the aging rule (#34) removed the residue
# (older trains parking on the last free airolo tracks for good), and the
# widened workload now drains fully (test_benchmarks.py). The committed
# scenario stays at `|dest| = 2` for the continuity column.
#
# Departure ends alternate deliberately rather than uniformly. At Claro the east
# end of a track is served by a blue line and the west end by the yellow, so a
# workload that always departs the same way never touches one of the three line
# sections; departing both ways is what puts all three under load. Departing
# Airolo the choice is real either way, since all three lines meet at WX310 —
# and that is where `k = 2` earns its keep, choosing between two lines rather
# than two ends of one track.

scenario: saturation
layout: gotthard-v0

trains:
  t1: { at: claro_1, facing: B }
  t2: { at: claro_2, facing: A }
  t3: { at: claro_3, facing: B }
  t4: { at: airolo_1, facing: A }
  t5: { at: airolo_2, facing: B }

# airolo_3 is the one free track at the start, so t1 is the only train that can
# launch; every other request is waiting on the slot t1 is about to vacate.
requests:
  - { train: t1, from: claro_1.B, to: [airolo_3] } # blue 2
  - { train: t1, from: A, to: [claro_3] }
  - { train: t1, from: A, to: [airolo_2] } # the yellow

  - { train: t2, from: claro_2.A, to: [airolo_1] } # the yellow
  - { train: t2, from: B, to: [claro_1] }
  - { train: t2, from: B, to: [airolo_3] } # blue 2

  - { train: t3, from: claro_3.B, to: [airolo_2] } # blue 1
  - { train: t3, from: B, to: [claro_2] }
  - { train: t3, from: A, to: [airolo_1] } # the yellow

  - { train: t4, from: airolo_1.A, to: [claro_1] }
  - { train: t4, from: B, to: [airolo_3] } # blue 2
  - { train: t4, from: B, to: [claro_3] }

  - { train: t5, from: airolo_2.B, to: [claro_2] }
  - { train: t5, from: B, to: [airolo_1] } # blue 2
  - { train: t5, from: A, to: [claro_1] }
