# gotthard-v0/meet — two trains, opposite directions (docs/BENCHMARKS.md, #31).
#
# The smallest story the real railroad can tell: one train each way between the
# stations, launched together, with three line sections to share out
# between them.
#
# The asymmetry BENCHMARKS.md describes is what makes it worth running. `south`
# leaves Claro by the east end of track 2, and at Claro the east end of each
# track is served by exactly one blue line — blue 2 reaches tracks 1 and 2 — so
# its line is fixed by the departure end alone. `north` leaves Airolo, where all
# three lines meet at the single WX310 junction, so it has a genuine choice and
# is the train that has to make it.
#
# Both name a single arrival track, either way round, so `|dest| = 2`: the
# continuity point, the request this model had before arrival ends existed.

scenario: meet
layout: gotthard-v0

trains:
  south: { at: claro_2, facing: B }
  north: { at: airolo_1, facing: A }

requests:
  - { train: south, from: claro_2.B, to: [airolo_2] }
  - { train: north, from: airolo_1.A, to: [claro_1] }
