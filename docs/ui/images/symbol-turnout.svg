<svg xmlns="http://www.w3.org/2000/svg" viewBox="-0.2 -0.2 1.4 1.4" width="73" height="73">
<style>
.track { fill: none; stroke: #12151a; stroke-width: 0.15; stroke-linecap: round; }
.block-body { fill: #ffffff; stroke: #12151a; stroke-width: 0.045; }
.track.cut { stroke-linecap: butt; }
.plaque { fill: #12151a; }
.lamp.clear { fill: #17a24a; }
.lamp.danger { fill: #e0332a; }
.stop, .mark, .portal-mouth, .tick { fill: none; stroke: #12151a; stroke-linecap: butt; }
.mark { stroke-width: 0.045; }
.stop { stroke-width: 0.18; }
.portal-mouth { stroke: #7c8087; stroke-width: 0.03; }
.tick { stroke-width: 0.045; }
</style>
<g transform="translate(0 0)"><path class="track" d="M0 0.5 L1 0.5"></path><path class="track" d="M0 0.5 L0.5 0"></path></g>
</svg>
