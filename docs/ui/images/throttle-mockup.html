<title>Throttle Mockup</title>
<style>
/* Layout: phone-sized throttle panels, laid out by the view's own width; a gallery of device frames under #frames. */
:root {
  --band: #1d4ed8;
  --band-ink: #ffffff;
  --rail: #064e3b;
  --rail-group: #059669;
  --power-on: #4ade80;
  --stop: #ef4444;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
:root, [data-theme="light"] {
  color-scheme: light;
  --bg: #eef1f6;
  --surface: #ffffff;
  --surface-2: #f3f5f9;
  --well: #e4e9f1;
  --ink: #0f172a;
  --muted: #5d6779;
  --line: #d8dee8;
  --accent: #2563eb;
  --on-accent: #ffffff;
  --accent-soft: #dbe7ff;
  --accent-ink: #1e3a8a;
  --locked: #15803d;
  --chosen: #0e7490;
  --fn-off: #eef1f6;
  --fn-off-ink: #334155;
  --tick: #a7b1c2;
  --scrim: rgba(15, 23, 42, 0.42);
  --sig-rim: #c3cad4;
  --mast: #9aa5b5;
  --shadow: 0 1px 2px rgb(15 23 42 / 0.05), 0 10px 30px -14px rgb(15 23 42 / 0.25);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #090e1a;
    --surface: #111829;
    --surface-2: #172036;
    --well: #0b1222;
    --ink: #e7ebf3;
    --muted: #8c97ad;
    --line: #232e47;
    --accent: #5b9dff;
    --on-accent: #04122e;
    --accent-soft: #1d3a7a;
    --accent-ink: #dce8ff;
    --locked: #4ade80;
    --chosen: #22d3ee;
    --fn-off: #182238;
    --fn-off-ink: #cdd6e4;
    --tick: #3d4a63;
    --scrim: rgba(0, 0, 0, 0.6);
    --sig-rim: #4a5466;
    --mast: #2b3446;
    --shadow: 0 1px 2px rgb(0 0 0 / 0.4), 0 12px 32px -16px rgb(0 0 0 / 0.7);
  }
}
[data-theme="dark"] {
  color-scheme: dark;
  --bg: #090e1a;
  --surface: #111829;
  --surface-2: #172036;
  --well: #0b1222;
  --ink: #e7ebf3;
  --muted: #8c97ad;
  --line: #232e47;
  --accent: #5b9dff;
  --on-accent: #04122e;
  --accent-soft: #1d3a7a;
  --accent-ink: #dce8ff;
  --locked: #4ade80;
  --chosen: #22d3ee;
  --fn-off: #182238;
  --fn-off-ink: #cdd6e4;
  --tick: #3d4a63;
  --scrim: rgba(0, 0, 0, 0.6);
  --sig-rim: #4a5466;
  --mast: #2b3446;
  --shadow: 0 1px 2px rgb(0 0 0 / 0.4), 0 12px 32px -16px rgb(0 0 0 / 0.7);
}

body { background: var(--bg); color: var(--ink); font-family: var(--font); }
html:not(.mode-frames), html:not(.mode-frames) body, html:not(.mode-frames) #root { height: 100%; overflow: hidden; }
button { font: inherit; }
button:focus-visible, a:focus-visible, .track:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.defs { position: absolute; width: 0; height: 0; }
.live { height: 100%; }

/* ---------- app chrome (look) ---------- */
.app { display: flex; flex-direction: column; width: 100%; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink); }
.band { flex: none; height: 60px; display: flex; align-items: center; gap: 12px; padding: 0 14px; background: var(--band); color: var(--band-ink); }
.mark { flex: none; width: 34px; height: 34px; border-radius: 7px; background: #fff; color: var(--band); display: grid; place-items: center; font: 800 15px var(--font); letter-spacing: -0.03em; }
.name { display: flex; gap: 8px; min-width: 0; font-size: 20px; font-weight: 650; white-space: nowrap; overflow: hidden; }
.app.narrow .name .ui { display: none; }
.spacer { flex: 1; }
.items { display: flex; align-items: center; gap: 4px; }
.bp { width: 36px; height: 36px; border: 0; border-radius: 6px; background: transparent; color: var(--band-ink); display: grid; place-items: center; cursor: pointer; padding: 0; }
.bp svg { width: 20px; height: 20px; }
.bp.pw { background: rgba(255, 255, 255, 0.15); color: rgba(255, 255, 255, 0.55); }
.bp.pw.on { color: var(--power-on); }
.bp.ss svg { width: 25px; height: 25px; }
.body { flex: 1; min-height: 0; display: flex; }
.app.strip .body { flex-direction: column; }
.rail { flex: none; display: flex; flex-direction: column; padding: 8px 6px; background: var(--rail); }
.app.strip .rail { flex-direction: row; padding: 6px 8px; }
.grp { display: flex; flex-direction: column; gap: 3px; padding: 3px; border-radius: 7px; background: rgba(0, 0, 0, 0.25); }
.app.strip .grp { flex-direction: row; }
.vb { width: 44px; height: 44px; padding: 0; border: 0; border-radius: 5px; background: transparent; color: #fff; display: grid; place-items: center; opacity: 0.8; cursor: pointer; }
.vb svg { width: 22px; height: 22px; }
.vb[aria-current="page"] { background: var(--rail-group); opacity: 1; }

/* ---------- the throttle view ---------- */
.view { flex: 1; min-width: 0; min-height: 0; overflow-x: hidden; overflow-y: auto; display: flex; flex-wrap: wrap; justify-content: center; align-content: flex-start; gap: 20px; padding: 16px 8px; }
.view.single { padding: 0; gap: 0; }
.panel { position: relative; flex: none; width: var(--pw); height: var(--ph); display: flex; flex-direction: column; overflow: hidden; background: var(--bg); }
.panel.card { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; box-shadow: var(--shadow); }

.pic { position: relative; display: block; flex: none; width: 100%; aspect-ratio: 16 / 9; padding: 0; border: 0; overflow: hidden; background: #0b1020; cursor: pointer; }
.pic > canvas, .pic > svg { display: block; width: 100%; height: 100%; }
.chip { position: absolute; display: flex; align-items: center; gap: 5px; padding: 5px 9px; border-radius: 999px; background: rgb(0 0 0 / 0.5); color: #fff; font: 650 12px/1 var(--font); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
.chip svg { width: 14px; height: 14px; }
.tname { left: 10px; bottom: 10px; border-radius: 7px; font-size: 13px; letter-spacing: 0.01em; }
.hint { top: 10px; right: 10px; }
.live-mark { top: 10px; left: 10px; letter-spacing: 0.08em; font-size: 11px; }
.live-mark i { width: 7px; height: 7px; border-radius: 50%; background: var(--stop); box-shadow: 0 0 6px var(--stop); animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: 0.35; } }
@media (prefers-reduced-motion: reduce) { .live-mark i { animation: none; } }
.noimg { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; background: radial-gradient(120% 90% at 50% 30%, var(--surface) 0%, var(--surface-2) 70%); color: var(--muted); }
.noimg svg { width: 64px; height: 64px; }
.noimg span { color: var(--ink); font-size: 22px; font-weight: 700; letter-spacing: -0.01em; }

.lower { position: relative; flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) clamp(104px, 30%, 136px); gap: 12px; padding: 12px; }
.left { display: flex; flex-direction: column; gap: 12px; min-height: 0; min-width: 0; }
.readout { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: start; }
.clock { grid-column: 1; grid-row: 1; width: 64px; height: 64px; filter: drop-shadow(0 1px 2px rgb(0 0 0 / 0.25)); }
.blocks { grid-column: 1; grid-row: 2; display: grid; grid-template-columns: auto 1fr; gap: 6px 8px; align-items: center; }
.lab { font-size: 10px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.blk { justify-self: start; padding: 5px 8px; border: 1px solid var(--line); border-radius: 7px; background: var(--surface-2); color: var(--ink); font: 700 15px/1 var(--mono); }
.blk.locked { color: var(--locked); border-color: color-mix(in srgb, var(--locked) 45%, transparent); background: color-mix(in srgb, var(--locked) 10%, transparent); }
.blk.chosen { color: var(--chosen); border-color: color-mix(in srgb, var(--chosen) 45%, transparent); background: color-mix(in srgb, var(--chosen) 10%, transparent); }
.blk.none { color: var(--muted); border-color: transparent; background: none; font-weight: 500; }
.signal { grid-column: 2; grid-row: 1 / span 2; }
.sig { display: block; width: 50px; height: 156px; }

.fns { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; align-content: start; }
.fn { position: relative; min-height: 50px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 12px; background: var(--fn-off); color: var(--fn-off-ink); font: 500 14px/1.2 var(--font); cursor: pointer; }
.fn[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent-ink); border-color: color-mix(in srgb, var(--accent) 50%, transparent); font-weight: 650; }
.fn[aria-pressed="true"]::after { content: ""; position: absolute; top: 7px; right: 7px; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 6px var(--accent); }
.nofn { grid-column: 1 / -1; padding: 10px 2px; color: var(--muted); font-size: 13px; }

.throttle { display: flex; flex-direction: column; gap: 10px; min-height: 0; }
.num { text-align: center; font: 700 36px/1 var(--font); font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
.num .u { margin-left: 2px; color: var(--muted); font-size: 16px; font-weight: 650; }
.dirl { display: flex; justify-content: center; align-items: center; gap: 4px; margin-top: 5px; color: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase; }
.dirl svg { width: 11px; height: 11px; color: var(--accent); }
.track { --pad: 18px; --v: 0; position: relative; flex: 1; min-height: 160px; overflow: hidden; border-radius: 16px; background: var(--well); box-shadow: inset 0 1px 3px rgb(0 0 0 / 0.14); touch-action: none; cursor: grab; }
.track .fill { position: absolute; left: 0; right: 0; bottom: 0; height: calc(var(--pad) + (100% - 2 * var(--pad)) * var(--v)); background: linear-gradient(to top, color-mix(in srgb, var(--accent) 24%, transparent), color-mix(in srgb, var(--accent) 6%, transparent)); }
.track b { position: absolute; left: 50%; height: 2px; border-radius: 2px; background: var(--tick); bottom: calc(var(--pad) + (100% - 2 * var(--pad)) * var(--i) / 20 - 1px); width: calc(28% + 56% * var(--i) / 20); transform: translateX(-50%); }
.track b.lit { background: var(--accent); }
.thumb { position: absolute; left: 8px; right: 8px; height: 24px; bottom: calc(var(--pad) + (100% - 2 * var(--pad)) * var(--v) - 12px); display: flex; flex-direction: column; justify-content: center; gap: 3px; border-radius: 9px; background: var(--accent); box-shadow: 0 4px 12px -4px color-mix(in srgb, var(--accent) 80%, transparent); }
.thumb i { display: block; width: 36%; height: 2px; margin: 0 auto; border-radius: 1px; background: var(--on-accent); opacity: 0.7; }
.act { flex: none; height: 64px; display: grid; place-items: center; border: 1px solid transparent; border-radius: 16px; cursor: pointer; transition: transform 80ms; }
.act svg { width: 30px; height: 30px; }
.act:active { transform: scale(0.97); }
.act.stopping { background: var(--stop); color: #fff; box-shadow: 0 6px 16px -6px color-mix(in srgb, var(--stop) 70%, transparent); }
.act.rest { background: var(--surface-2); border-color: var(--line); color: var(--accent); }
.panel.dead .fns, .panel.dead .throttle { opacity: 0.4; pointer-events: none; }
.still { position: absolute; left: 12px; right: 12px; bottom: 12px; margin: 0; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); box-shadow: var(--shadow); font-size: 14px; font-weight: 650; text-align: center; }

/* ---------- train selector ---------- */
.selector { position: absolute; inset: 0; z-index: 5; display: flex; flex-direction: column; background: var(--bg); }
.panel.card .selector { background: var(--surface); }
.selector header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 16px 10px; }
.selector h2 { margin: 0; font-size: 19px; font-weight: 700; letter-spacing: -0.01em; }
.sub { margin: 2px 0 0; color: var(--muted); font-size: 12.5px; }
.x { flex: none; width: 40px; height: 40px; padding: 0; border: 1px solid var(--line); border-radius: 50%; background: var(--surface-2); color: var(--ink); display: grid; place-items: center; cursor: pointer; }
.x svg { width: 18px; height: 18px; }
.sel-note { margin: 0 14px 8px; padding: 8px 10px; border-radius: 10px; background: color-mix(in srgb, var(--stop) 12%, transparent); font-size: 13px; }
.grid { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-content: start; padding: 4px 14px 14px; }
.tc { display: flex; flex-direction: column; padding: 0; overflow: hidden; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); color: var(--ink); text-align: left; cursor: pointer; box-shadow: 0 1px 2px rgb(0 0 0 / 0.05); }
.panel.card .tc { background: var(--surface-2); }
.th { position: relative; display: block; width: 100%; aspect-ratio: 16 / 9; overflow: hidden; background: var(--surface-2); }
.th svg.photo { display: block; width: 100%; height: 100%; }
.th .noimg svg { width: 36px; height: 36px; }
.tb { display: flex; flex-direction: column; gap: 2px; padding: 8px 10px 10px; }
.tn { font-size: 15px; font-weight: 700; }
.tw { color: var(--muted); font: 500 12px var(--mono); }
.ts { margin-top: 2px; color: var(--muted); font-size: 11.5px; }
.ts.me { color: var(--accent); font-weight: 650; }
.tc.held { opacity: 0.45; }
.tc.held .th { filter: grayscale(0.8); }
.tc.mine { border-color: var(--accent); box-shadow: 0 0 0 1.5px var(--accent); }
.tc:disabled { cursor: not-allowed; }
.selector footer { padding: 12px 14px; border-top: 1px solid var(--line); }
.rel { width: 100%; height: 48px; border: 1.5px solid color-mix(in srgb, var(--stop) 60%, transparent); border-radius: 12px; background: transparent; color: var(--stop); font-size: 15px; font-weight: 650; cursor: pointer; }
.rel:disabled { border-color: var(--line); color: var(--muted); opacity: 0.6; cursor: default; }

.confirm { position: absolute; inset: 0; z-index: 10; display: grid; place-items: center; padding: 20px; background: var(--scrim); }
.dlg { max-width: 320px; padding: 20px; border: 1px solid var(--line); border-radius: 18px; background: var(--surface); color: var(--ink); box-shadow: 0 20px 50px -20px rgb(0 0 0 / 0.5); }
.dlg h3 { margin: 0 0 8px; font-size: 18px; }
.dlg p { margin: 0 0 18px; color: var(--muted); font-size: 14px; line-height: 1.45; }
.row { display: flex; gap: 10px; }
.row button { flex: 1; height: 46px; border-radius: 12px; font-size: 15px; font-weight: 650; cursor: pointer; }
.cancel { border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); }
.ok { border: 0; background: var(--accent); color: var(--on-accent); }

/* ---------- gallery (#frames) ---------- */
.gallery { max-width: 1560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 28px 48px; }
.g-head h1 { margin: 0 0 6px; font-size: 26px; letter-spacing: -0.02em; text-wrap: balance; }
.g-head p { max-width: 70ch; margin: 0 0 14px; color: var(--muted); line-height: 1.5; }
.g-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; }
.seg { display: inline-flex; overflow: hidden; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.seg button { padding: 8px 14px; border: 0; background: transparent; color: var(--muted); font-size: 13px; font-weight: 650; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent-ink); }
.g-link { color: var(--accent); font-weight: 650; text-decoration: none; }
.g-frames { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 32px 28px; margin-top: 26px; }
.frame { display: flex; flex-direction: column; gap: 10px; min-width: 0; margin: 0; }
.dev { padding: 9px; border-radius: 34px; background: #0b0d12; box-shadow: 0 18px 40px -22px rgb(0 0 0 / 0.55), inset 0 0 0 1px #2a2f3a; }
.frame.tab .dev { border-radius: 26px; }
.clip { position: relative; overflow: hidden; border-radius: 26px; }
.frame.tab .clip { border-radius: 17px; }
.screen { position: absolute; top: 0; left: 0; transform-origin: 0 0; }
.frame figcaption { color: var(--muted); font-size: 13px; }
.frame figcaption b { margin-right: 6px; color: var(--ink); font-weight: 650; }
</style>

<script>

/* The camera car's picture, faked: track running towards the camera at the train's speed. */
const cams = new Set();
function drawCam(cv, off) {
  const x = cv.getContext("2d"), w = cv.width, h = cv.height, hz = h * 0.46, vx = w * 0.5, G = h - hz, CO = w * 0.07;
  const Y = (d) => hz + G / d, X = (lat, d) => vx + (lat + CO) / d;
  let g = x.createLinearGradient(0, 0, 0, hz);
  g.addColorStop(0, "#5d8fd0"); g.addColorStop(1, "#dbe6f2");
  x.fillStyle = g; x.fillRect(0, 0, w, hz + 1);
  const ridge = (c, a) => { x.fillStyle = c; x.beginPath(); x.moveTo(0, hz + 1); for (let i = 0; i < a.length; i += 2) x.lineTo(a[i] * w, a[i + 1] * hz); x.lineTo(w, hz + 1); x.closePath(); x.fill(); };
  ridge("#aab9cd", [0, .62, .1, .5, .2, .6, .31, .3, .42, .55, .55, .36, .66, .58, .78, .34, .9, .52, 1, .44]);
  ridge("#7f9270", [0, .86, .15, .74, .3, .84, .45, .78, .6, .88, .75, .76, .88, .85, 1, .8]);
  g = x.createLinearGradient(0, hz, 0, h);
  g.addColorStop(0, "#86965f"); g.addColorStop(1, "#38442a");
  x.fillStyle = g; x.fillRect(0, hz, w, G);
  x.fillStyle = "#8f897c"; x.beginPath(); x.moveTo(X(-w * .5, .5), Y(.5)); x.lineTo(X(0, 400), hz); x.lineTo(X(w * .5, .5), Y(.5)); x.closePath(); x.fill();
  const sp = 0.5, ph = ((off % sp) + sp) % sp, SW = w * 0.34;
  for (let k = 90; k >= 0; k--) {
    const d = 0.5 + k * sp + sp - ph, d2 = d + 0.14;
    x.fillStyle = `rgba(58,44,34,${0.3 + 0.6 * Math.min(1, 3 / d)})`;
    x.beginPath(); x.moveTo(X(-SW, d), Y(d)); x.lineTo(X(SW, d), Y(d)); x.lineTo(X(SW, d2), Y(d2)); x.lineTo(X(-SW, d2), Y(d2)); x.closePath(); x.fill();
  }
  const GW = w * 0.2, RW = w * 0.016;
  for (const s of [-1, 1]) {
    g = x.createLinearGradient(0, hz, 0, h); g.addColorStop(0, "#9aa1aa"); g.addColorStop(1, "#eef0f3");
    x.fillStyle = g; x.beginPath();
    x.moveTo(X(s * GW, .5), Y(.5)); x.lineTo(X(s * (GW + RW), .5), Y(.5)); x.lineTo(X(s * (GW + RW), 300), Y(300)); x.lineTo(X(s * GW, 300), Y(300));
    x.closePath(); x.fill();
  }
  const ms = 7, mph = ((off % ms) + ms) % ms;

    x.lineWidth = lw; x.beginPath(); x.moveTo(mx, Y(d)); x.lineTo(mx, hz - (G * 1.15) / d); x.stroke();
    x.lineWidth = lw * 0.6; x.beginPath(); x.moveTo(mx, hz - (G * 1.02) / d); x.lineTo(X(-GW * 0.3, d), hz - (G * 1.02) / d); x.stroke();
  }
  x.lineWidth = Math.max(1, w / 500); x.beginPath(); x.moveTo(X(0, .6), hz - (G * 0.95) / .6); x.lineTo(X(0, 300), hz - (G * 0.95) / 300); x.stroke();
  g = x.createLinearGradient(0, hz - h * .05, 0, hz + h * .05);
  g.addColorStop(0, "rgba(255,255,255,0)"); g.addColorStop(.5, "rgba(255,255,255,.25)"); g.addColorStop(1, "rgba(255,255,255,0)");

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  for (const c of cams) {
    if (!c.canvas.isConnected) { cams.delete(c); continue; }
    c.off += speedOf(c.tid) * dt * 2.4;
    const dpr = Math.min(2, devicePixelRatio || 1), W = Math.round(c.canvas.clientWidth * dpr), H = Math.round(c.canvas.clientHeight * dpr);

    const key = `${W}x${H}:${c.off}`;
    if (key === c.drawn) continue;
    if (c.canvas.width !== W || c.canvas.height !== H) { c.canvas.width = W; c.canvas.height = H; }
    drawCam(c.canvas, c.off); c.drawn = key;
  }
  requestAnimationFrame(loop);
}

/* ---------- one throttle ---------- */
class Panel {
  constructor(app) {
    this.id = "p" + ++seq; this.app = app;

      <div class="lower">
        <div class="left">
          <div class="readout">${clockSVG()}<div class="blocks"></div><div class="signal"></div></div>
          <div class="fns"></div>
        </div>
        <div class="throttle">
          <div class="pct"><div class="num"><span class="v">0</span><span class="u">%</span></div><div class="dirl"></div></div>
          <div class="track" role="slider" tabindex="0" aria-label="Speed" aria-valuemin="0" aria-valuemax="100"><div class="fill"></div><div class="thumb"><i></i><i></i><i></i></div></div>
          <button class="act" type="button"></button>
        </div>
        <p class="still" hidden>The track has no power — switch it on to drive.</p>
      </div>
      <div class="selector" hidden>
        <header><div><h2>Choose a train</h2><p class="sub"></p></div><button class="x" type="button" aria-label="Close">${I.close}</button></header>
        <div class="sel-note" hidden>The track has no power — switch it on to take a train.</div>
        <div class="grid"></div>
        <footer><button class="rel" type="button">Release</button></footer>
      </div>
      <div class="confirm" hidden><div class="dlg" role="dialog" aria-modal="true"><h3></h3>
        <p>Another throttle is driving this train. Taking it releases it there first. In manual driving the train stops before it is yours.</p>
        <div class="row"><button class="cancel" type="button">Cancel</button><button class="ok" type="button">Take train</button></div></div></div>`;
    const q = (s) => el.querySelector(s);
    Object.assign(this, { $pic: q(".pic"), $blocks: q(".blocks"), $signal: q(".signal"), $fns: q(".fns"), $v: q(".v"), $dirl: q(".dirl"), $track: q(".track"),
      $act: q(".act"), $still: q(".still"), $sel: q(".selector"), $sub: q(".sub"), $x: q(".x"), $note: q(".sel-note"), $grid: q(".grid"), $rel: q(".rel"),
      $confirm: q(".confirm"), $ctitle: q(".confirm h3") });
    this.ticks = [];
    for (let i = 0; i <= 20; i++) {
      const b = document.createElement("b");
      b.style.setProperty("--i", i);
      this.$track.insertBefore(b, this.$track.querySelector(".thumb"));
      this.ticks.push(b);
    }
    this.$pic.addEventListener("click", () => { this.sel = true; this.update(); });
    this.$x.addEventListener("click", () => { this.sel = false; this.update(); });
    this.$rel.addEventListener("click", () => this.release());
    this.$grid.addEventListener("click", (e) => { const b = e.target.closest("[data-t]"); if (b && !b.disabled) this.choose(b.dataset.t); });
    q(".cancel").addEventListener("click", () => { this.confirm = null; this.update(); });
    q(".ok").addEventListener("click", () => this.take(this.confirm));
    this.$act.addEventListener("click", () => {
      if (!this.live()) return;
      if (this.value > 0) this.value = 0; else this.dir = -this.dir;
      this.renderThrottle(); this.renderReadout(T(heldBy(this.id)));
    });
    this.$fns.addEventListener("click", (e) => {
      const b = e.target.closest(".fn"), mine = heldBy(this.id);
      if (!b || !this.live()) return;
      const on = S.fnOn[mine];
      on.has(b.dataset.f) ? on.delete(b.dataset.f) : on.add(b.dataset.f);
      notify();
    });

    tr.addEventListener("pointerdown", (e) => {
      if (!this.live()) return;

    notify();
  }

    if (!mine || !S.power) return;
    delete S.holder[mine];
    this.value = 0;
    notify();
  }

    this.$still.hidden = S.power || !t;

  }
  renderPic(t) {

    if (!t) this.$pic.innerHTML = `<span class="noimg">${I.trainFront}<span>No train</span></span>`;
    else if (t.camera) {
      this.$pic.innerHTML = `<canvas aria-hidden="true"></canvas><span class="chip live-mark"><i></i>LIVE</span>${name}${hint}`;
      cams.add({ canvas: this.$pic.querySelector("canvas"), tid: t.id, off: 0, drawn: "" });
    } else if (t.photo) this.$pic.innerHTML = photoSVG(t.photo) + name + hint;

  }
  renderReadout(t) {
    if (!t) { this.$blocks.innerHTML = ""; this.$signal.innerHTML = ""; return; }
    const row = (lab, val, cls) => `<span class="lab">${lab}</span>` + (val ? `<span class="blk ${cls}">${val}</span>` : `<span class="blk none">—</span>`);
    this.$blocks.innerHTML = row(t.at ? "at" : "crossing", t.at || t.crossing, "") + row("next", t.next, t.claim) + row("to", t.end, t.claim);
    this.$signal.innerHTML = signalSVG(this.dir > 0 ? t.aspect.f : t.aspect.r);
  }
  buildFns(t) {
    if (!t) { this.$fns.innerHTML = ""; return; }

      ? t.fns.map((f) => `<button class="fn" type="button" data-f="${f}" aria-pressed="false">${f}</button>`).join("")
      : `<p class="nofn">This train has no functions.</p>`;

    this.$v.textContent = Math.round(v * 100);

    this.$dirl.innerHTML = `${fwd ? I.fwd : I.rev}<span>${fwd ? "Forward" : "Reverse"}</span>`;
    this.$track.setAttribute("aria-valuenow", Math.round(v * 100));

      this.$act.className = "act stopping"; this.$act.innerHTML = I.stop; this.$act.setAttribute("aria-label", "Stop");
    } else {

    }
  }
  renderSelector(mine) {
    this.$sel.hidden = !(this.sel || !mine);
    this.$x.hidden = !mine;
    this.$rel.disabled = !mine || !S.power;
    this.$rel.textContent = mine ? `Release ${T(mine).name}` : "Release";
    this.$note.hidden = S.power;

        return `<button class="tc ${st}" type="button" data-t="${t.id}"${S.power ? "" : " disabled"}><span class="th">${thumbHTML(t)}</span>` +
          `<span class="tb"><span class="tn">${t.name}</span><span class="tw">${t.at ? "at " + t.at : "crossing " + t.crossing}</span>${note}</span></button>`;

  destroy() { panels.delete(this.id); for (const [t, h] of Object.entries(S.holder)) if (h === this.id) delete S.holder[t]; this.el.remove(); }
}

      <span class="spacer"></span><span class="items">
        <button class="bp" type="button" title="Driving: manual" aria-label="Driving: manual">${I.person}</button>
        <button class="bp pw on" type="button" title="Track power" aria-label="Track power">${I.bolt}</button>
        <button class="bp ss" type="button" title="Stop" aria-label="Stop">${I.stopsign}</button>
        <button class="bp" type="button" title="Settings" aria-label="Settings">${gearSVG()}</button>
        <a class="bp" href="#frames" title="Mockup: every screen size" aria-label="Mockup: every screen size">${I.help}</a></span></header>
      <div class="body"><nav class="rail" aria-label="Views"><div class="grp">${views}</div></nav><main class="view"></main></div>`;
    host.append(el);
    this.view = el.querySelector(".view");
    this.$pw = el.querySelector(".pw");
    this.$pw.addEventListener("click", () => { S.power = !S.power; notify(); });
    el.querySelector(".ss").addEventListener("click", () => { S.power = false; notify(); });
    this.ro = new ResizeObserver(() => {
      const w = el.clientWidth, h = el.clientHeight;
      el.classList.toggle("strip", w <= 600 || h <= 640);
      el.classList.toggle("narrow", w <= 480);
      this.layout();
    });
    this.ro.observe(el);
    this.ro2 = new ResizeObserver(() => this.layout());
    this.ro2.observe(this.view);
  }
  addPanel() { const p = new Panel(this); panels.set(p.id, p); this.panels.push(p); this.view.append(p.el); p.update(); }
  layout() {
    const W = this.view.clientWidth, H = this.view.clientHeight;
    if (!W) return;
    const single = W <= MAX_W, Wc = single ? W : W - 2 * HPAD;
    const n = single ? 1 : Math.max(1, Math.floor((Wc + GAP) / (MIN_W + GAP)));
    while (this.panels.length < n) this.addPanel();
    for (let i = this.panels.length - 1; i >= 0 && this.panels.length > n; i--) {
      const p = this.panels[i];
      if (!heldBy(p.id) && !p.confirm) { p.destroy(); this.panels.splice(i, 1); }
    }
    const pw = single ? W : Math.min(MAX_W, Math.floor((Wc - GAP * (n - 1)) / n));
    const ph = Math.round(Math.max(MIN_H, Math.min(MAX_H, H - (single ? 0 : 2 * VPAD))));
    this.view.classList.toggle("single", single);
    this.view.style.setProperty("--pw", pw + "px");
    this.view.style.setProperty("--ph", ph + "px");
    this.panels.forEach((p) => p.el.classList.toggle("card", !single));
    if (this.init) {
      this.init.forEach((h, i) => {
        const p = this.panels[i];
        if (!p) return;
        if (h.train) { S.holder[h.train] = p.id; p.value = h.value || 0; p.dir = h.dir || 1; }
        if (h.confirm) p.confirm = h.confirm;
      });
      this.init = null;
      notify();
    }
  }
  update() { this.$pw.classList.toggle("on", S.power); this.panels.forEach((p) => p.update()); }
  destroy() { this.ro.disconnect(); this.ro2.disconnect(); }
}

/* ---------- live mode and the gallery ---------- */
const FRAMES = [
  { label: "iPhone 16 Pro Max", w: 440, h: 956, init: [{ train: "e10", value: 0.35, dir: 1 }] },
  { label: "Small phone", w: 360, h: 780, init: [] },
  { label: "iPad, portrait", w: 820, h: 1180, tab: true, init: [{ train: "ic2", value: 0, dir: -1 }, { train: "sbahn12", value: 0.6, dir: 1 }] },
  { label: "iPad, landscape", w: 1180, h: 820, tab: true, init: [{ train: "cargo7", value: 0.2, dir: 1 }, { confirm: "re460" }] },
];
const root = document.getElementById("root");
let fitFrames = null;

function route() {
  apps.forEach((a) => a.destroy());
  apps = []; panels.clear(); cams.clear(); resetState();
  root.innerHTML = ""; fitFrames = null;
  const frames = location.hash === "#frames";
  document.documentElement.classList.toggle("mode-frames", frames);
  if (!frames) {
    const host = document.createElement("div");
    host.className = "live";
    root.append(host);
    apps.push(new App(host, [{ train: "e10", value: 0.35, dir: 1 }, { train: "ic2", value: 0, dir: -1 }]));
    tickClocks();
    return;
  }
  const g = document.createElement("div");
  g.className = "gallery";
  g.innerHTML = `<header class="g-head"><h1>Throttle mockup</h1>
    <p>A throwaway mockup of the throttle redesign, with made-up trains. Every frame works: drag a slider, press the button under it, tap a picture to choose a train. The frames share one railroad, so a train taken in one frame shows faint in the others. The band's power button switches the track off.</p>
    <div class="g-tools"><div class="seg" role="group" aria-label="Theme"><button type="button" data-th="" aria-pressed="true">System</button><button type="button" data-th="light" aria-pressed="false">Light</button><button type="button" data-th="dark" aria-pressed="false">Dark</button></div>
    <a class="g-link" href="#live">Open full screen</a></div></header><div class="g-frames"></div>`;
  root.append(g);
  const fr = g.querySelector(".g-frames");
  g.querySelectorAll(".seg button").forEach((b) => b.addEventListener("click", () => {
    g.querySelectorAll(".seg button").forEach((o) => o.setAttribute("aria-pressed", o === b));
    if (b.dataset.th) fr.dataset.theme = b.dataset.th; else delete fr.dataset.theme;
  }));
  const figs = FRAMES.map((F) => {
    const fig = document.createElement("figure");
    fig.className = "frame" + (F.tab ? " tab" : "");
    fig.innerHTML = `<div class="dev"><div class="clip"><div class="screen"></div></div></div><figcaption><b>${F.label}</b>${F.w} × ${F.h}</figcaption>`;
    fr.append(fig);
    const screen = fig.querySelector(".screen");
    screen.style.width = F.w + "px"; screen.style.height = F.h + "px";
    return { F, clip: fig.querySelector(".clip"), screen };
  });
  fitFrames = () => {
    const avail = fr.clientWidth - 18;
    for (const { F, clip, screen } of figs) {
      const s = Math.min(1, 560 / F.h, avail / F.w);
      clip.style.width = F.w * s + "px"; clip.style.height = F.h * s + "px";
      screen.style.transform = `scale(${s})`;
    }
  };
  fitFrames();
  figs.forEach(({ F, screen }) => apps.push(new App(screen, F.init)));
  tickClocks();
}
addEventListener("hashchange", route);
addEventListener("resize", () => fitFrames && fitFrames());
setInterval(tickClocks, 1000);
route();
requestAnimationFrame(loop);
</script>
