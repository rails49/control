# `reversing-loops`, v0 — SUPERSEDED. Kept only so the ADRs that cite it can be
# re-run.
#
# This is not the railroad on the bench. It is wrong about the track in two
# places, both found when the layout was drawn in the editor (#161):
#
#   station-C track 3.  `sw16` stands *in* track 3 on the railroad, and the
#                       road to sidings 6 and 7 leaves from there. This file
#                       models track 3 as one 1500 mm block with the sidings
#                       hanging off the throat beyond its end, so it is short
#                       one block the railroad has.
#
#   The west throat.    This file puts the yellow line and the C6/C7 sidings
#                       in one connection, `station_c_west`, so a shunt into
#                       siding 6 conflicts with the yellow's throat. On the
#                       railroad they are separate, and most of the difference
#                       between 37 concurrent pairs here and 33 there is that
#                       bundling.
#
# Its block lengths are wrong too — 700–4000 mm against the measured 200–1500.
#
# ADR-0006, ADR-0012 and ADR-0029 record numbers measured here, and an ADR is a
# record rather than a living document, so this file and its scenarios and
# goldens are frozen rather than corrected. `reversing-loops/…` in those three
# ADRs means `reversing-loops-v0/…`. The railroad on the bench is
# `reversing-loops.drawing.yaml`.
#
# Its header below cites `reversing-loops-rocrail.xml`, deleted in #161. The
# drawing on the bench carries the decoder addresses now, and Rocrail's ganging
# had gone stale against the rewired layout. Git history still has the file.
#
# Everything below this line is the file as it stood, and stays that way —
# including `meet`'s claim that blue 2 reaches tracks 1 and 2, which is wrong
# (blue 1 reaches 2 and 3; blue 2 reaches 1). A record is not patched. The one
# exception is the naming: the railroad and its two stations are de-identified
# here as everywhere else (#319), which changes what things are called and
# nothing about what the file says.
#
# ----------------------------------------------------------------------------
#
# `reversing-loops` — the railroad this project dispatches. Ticket #10, map #1.
#
# Checked against the owner's Rocrail netlist, `reversing-loops-rocrail.xml`
# (rendered as `reversing-loops-rocrail.png`), which is authoritative for
# topology; a WinTrack plan, no longer in the repository, was the source for
# block lengths.
#
# Converted mechanically from the hand-written layout (#43), then refined one
# junction at a time until every junction was drawn: station-A and station-C
# west (#46), then station-C east (#58, settling #35). All three are named for
# the switches they are in the netlist, so their concurrency is composed rather
# than declared, and the panel can show turnout detail everywhere.
#
# Symbol names are Rocrail's switch ids, which is what ties a drawn turnout
# back to the netlist and, later, to its decoder address.
#
# Block ids map 1:1 onto Rocrail's, which uses shorter names:
#   station_c_1..3 = c1..c3    station_c_4, station_c_5 = c6, c5
#   station_c_6, station_c_7 = c7, c8
#   station_a_1..4 = a1..a4    line_blue_1, line_blue_2 = b1, b2
#   line_yellow = bk1          (Rocrail's stale route ids still call bk1 `rw`)
#
# Three line sections join the two stations: two "blue" (one is drawn pink on
# the plan) and one "yellow". Because of the WX310 crossing, ALL THREE reach
# station-A tracks 1-3 from either end, so station-A is a single junction
# rather than two throats. At station-C the two blues meet the east end and the
# yellow the west.
#
# Everything not a block symbol below is connection: every turnout, the WX310,
# and the whole right-hand return loop. A connection can be metres of track — a
# train transits it but can never stop in it. Transit LENGTH is not modelled:
# every transit costs one tick regardless (#8), so the long return loop and a
# station ladder cost the same.
#
# How the wires below run, since the editor rewrites that list whole and any
# comment inside it would be lost on the first save (docs/store/DRAWING.md):
#
#   station-A, upper route: blue 2 in, over the WX310, out along the west
#     ladder.
#   station-A, lower route: the yellow and blue 1 meet at sw51 and run east.
#   station-A, round the loop and back down the east ladder into the B ends.
#   station-C west: the ladder off the yellow, then the sidings off track 3.
#   station-C east: blue 1 down to sw50, then blue 2 down to sw49 and the
#     sidings.
#
# Drawn by hand (#57) and re-laid out to the symbol geometry of #59: station-A
# along rows 1-4, station-C along rows 9-15, and the three line sections as
# columns in the open country between them. The WX310 is drawn as the X it is,
# which is what `crossing_90d` is for — the same four pins and the same two
# exclusive routes as any other crossing, drawn diagonally
# (docs/store/DRAWING.md). Geometry is decorative and cannot change what
# derives (docs/adr/0018): `tc49 layout show` is identical to what the same
# file derived unplaced, and to what it derived before the re-layout.
#
# No wire is drawn across a symbol, and exactly one wire crosses another: the
# yellow's lead over blue 2's, west of station-A. That is the crossing the plan
# itself has — Rocrail hops one over the other on connector tiles rather than
# joining them — so it is drawn rather than routed around.

drawing: reversing-loops-v0
units: mm

symbols:
  # ASSUMED — lengths are read off the plan to the nearest track section and are
  # used only for the admission fit check (does the train fit the destination).

  # station-C through tracks
  station_c_1: {kind: block, length: 1500, at: [7, 11]}
  station_c_2: {kind: block, length: 1500, at: [8, 12]}
  station_c_3: {kind: block, length: 1500, at: [9, 13]}
  # station-C sidings, north-east: off track 1's east lead (Rocrail c6, c5)
  station_c_4: {kind: block, length: 900, at: [7, 10], rot: 180}
  station_c_5: {kind: block, length: 900, at: [7, 9], rot: 180}
  # station-C sidings, south-west: off track 3's west lead (Rocrail c7, c8)
  station_c_6: {kind: block, length: 900, at: [2, 14], rot: 180}
  station_c_7: {kind: block, length: 900, at: [2, 15], rot: 180}

  # station-A through tracks, and its siding
  station_a_1: {kind: block, length: 1200, at: [21, 1]}
  station_a_2: {kind: block, length: 1200, at: [22, 2]}
  station_a_3: {kind: block, length: 1200, at: [22, 3]}
  station_a_4: {kind: block, length: 700, at: [29, 3]}

  # The three line sections between the stations
  line_blue_1: {kind: block, length: 3000, at: [18, 5], rot: 270}
  line_blue_2: {kind: block, length: 3000, at: [17, 5], rot: 270}
  line_yellow: {kind: block, length: 4000, at: [5, 5], rot: 90}

  # station-A — ONE junction, drawn from its real geometry (#46), which is the
  # owner's account on #35 read back off the netlist's track tiles. The WX310
  # lets every line section reach every station-A track from either end, so both
  # ends of tracks 1-3 belong here. A block end lives in exactly one
  # connection, which is why this cannot be split into a north and a south
  # throat.
  #
  # Two legs, with a scissors crossover between them:
  #
  #   line_blue_2 ==  sw17 ====\ /==== sw18  == sw41/sw42 ladder == tracks 1-3 A
  #                             X  (WX310)
  #   yellow/blue_1 = sw19 ====/ \==== sw20  == return loop ======= tracks 1-3 B
  #                                                    == sw35/sw36/sw39 ladder
  #
  # Set straight the WX310 passes two trains at once, one per leg: blue 2 to
  # the A ends while the yellow or blue 1 works the B ends. Set crossed it
  # passes one, exclusively. Nothing below declares that. A turnout's two ways
  # share its toe and the crossing's share its frog, so composition (DRAWING.md)
  # yields 18 pairs, blue 2 to any A end against the yellow or blue 1 to any B
  # end. Fifteen more come from the siding, which touches sw39 alone.
  #
  # `siding_4` keeps its hand-picked name, sw39's straight leg being the whole
  # of it. The other 18 each take two symbols to identify, an origin turnout
  # and a ladder leg, and one way through cannot carry two authored names, so
  # they take the derived name: their two block ends.

  # The WX310, west of the station: a turnout on each leg at each end, and the
  # crossing where the two diagonals meet. Each turnout's diverging leg lands
  # on the crossing pin above or below it, so all four of those wires are of
  # zero length; `b` runs from the upper leg's west points down to the lower
  # leg's east points and `a` the other way, which is a drawing choice and not
  # a topological one.
  #
  # Rocrail hops the yellow's lead over blue 2's on connector tiles rather than
  # crossing it, and #35 has those two movements running together, so there is
  # no second crossing here.
  sw17: {kind: turnout, connection: station_a, at: [18, 1], flip: true, rot: 180} # blue 2: on, or cross down
  sw18: {kind: turnout, connection: station_a, at: [19, 1], rot: 180} # A ends: on, or cross down
  sw19: {kind: turnout, connection: station_a, at: [19, 4]} # yellow/blue 1: on, or cross up
  sw20: {kind: turnout, connection: station_a, at: [20, 4], flip: true} # B ends: on, or cross up
  sw16: {kind: crossing_90d, connection: station_a, at: [18, 2]} # the WX310 itself

  # Where the lower leg splits: the yellow runs on west, blue 1 turns south.
  sw51: {kind: turnout, connection: station_a, at: [18, 4], rot: 180}

  # The west ladder, fanning the upper leg into the A ends of tracks 1-3.
  sw41: {kind: turnout, connection: station_a, at: [20, 1], flip: true, rot: 180}
  sw42: {kind: turnout, connection: station_a, at: [21, 2], flip: true, rot: 180}

  # The return loop off the east end: single track, so a bend rather than a
  # junction, and what puts the B ends on the lower leg. It sits well east of
  # everything, which is what keeps its two long wires clear of the station.
  return_loop: {kind: pin, at: [43, 4]}

  # The east ladder. sw39 sits on track 3's own lead, so the siding is its
  # straight leg and the ladder its diverging one.
  sw35: {kind: turnout, connection: station_a, at: [29, 1], rot: 180}
  sw36: {kind: turnout, connection: station_a, at: [28, 2], rot: 180}
  sw39:
    kind: turnout
    connection: station_a
    names: {straight: siding_4} # a4 trails off a3, per the Rocrail netlist
    at: [28, 3]

  # station-C west, drawn from real symbols (#46): the yellow line fans out to all
  # three through tracks down a ladder, and the two south sidings trail off
  # track 3's west lead. One symbol transit identifies each way through, so all
  # five keep the names the hand-written layout gave them.
  #
  # Composition adds the pairs the ladder always allowed: shunting between
  # track 3 and a siding shares no switch with the yellow reaching track 1 or
  # track 2.
  sw24:
    kind: turnout
    connection: station_c_west
    names: {straight: yellow_1}
    at: [6, 11]
    flip: true
    rot: 180
  sw46:
    kind: turnout
    connection: station_c_west
    names: {straight: yellow_2}
    at: [7, 12]
    flip: true
    rot: 180
  # ASSUMED, and the one thing here the tiles do not settle: sw44's point faces
  # track 3, so the sidings are reachable from it. Facing the other way they
  # would hang off the yellow instead — which is the mirror of what #35 found
  # at station_c_east, so the hedge stays until someone checks the real switch.
  sw44:
    kind: turnout
    connection: station_c_west
    names: {straight: yellow_3}
    at: [8, 13]
    rot: 180
  sw45:
    kind: turnout
    connection: station_c_west
    names: {straight: siding_6, diverging: siding_7}
    at: [8, 14]
    rot: 180

  # station-C east, drawn from real symbols (#58): the two blue lines DIVIDE the
  # station rather than both serving all of it. Blue 1 reaches tracks 2 and 3;
  # blue 2 reaches track 1 and, past it, the two north-east sidings.
  #
  # This is what makes the yellow loop matter: tracks 2 and 3 are reachable
  # from the east only over blue 1, so a train for track 3 that finds blue 1
  # occupied has no second eastern option — its alternative is the west end
  # entirely.
  #
  # This settles #35, and it is a topology change rather than a drawing one.
  # The hand-written layout ran blue 2 to tracks 1 and 2 and hung the sidings
  # off track 1's east lead; the netlist's track tiles say otherwise, and the
  # tiles are what this file is checked against (see the header). Traced:
  #
  #   b1 (19,7) east to (32,7), down the x=33 line to (33,15), then west and
  #     down to (32,16) and into sw50 (31,16) from the east. sw50 is `left`,
  #     so its roads run west to c2 and south to (31,17) and west to c3.
  #   b2 (19,8) east to (30,8), down the x=31 line to (31,15), then west into
  #     sw49 (27,15) from the east. sw49 is `right`, so its roads run west to
  #     c1 and north to (27,14), then west into sw48 (23,14) from the east.
  #     sw48 is `right`: west to c5, north to (23,13) and west to c6.
  #
  # Two consequences. `blue_2_2` does not exist and `blue_1_2` does; and the
  # sidings hang off blue 2's lead, not off station_c_1.B, so their transits run
  # from line_blue_2.A. The names the layout picked survive on the legs that
  # still carry them.
  #
  # And it is TWO connections, not one. The two leads share no track: sw50 sits
  # on blue 1's, sw49 and sw48 on blue 2's, and the two run parallel from
  # station-A without meeting. A junction is what derivation finds, not what a
  # generic symbol asserts, so the one opaque box splits into the two throats
  # it always was — named for Rocrail's block ids for the two lines, `b1` and
  # `b2`, which the header maps.
  #
  # That is also what ends this junction's blanket exclusivity, which it had
  # only because a symbol declaring nothing is exclusive (ADR-0006). Blue 1
  # working track 2 or 3 and blue 2 working track 1 or a siding are now
  # different connections and never conflict at all.
  sw50: # blue 1's lead: tracks 2 and 3
    kind: turnout
    connection: station_c_east_b1
    names: {straight: blue_1_2, diverging: blue_1_3}
    at: [15, 12]
    rot: 180
  sw49: # blue 2's lead: track 1, or on to the sidings
    kind: turnout
    connection: station_c_east_b2
    names: {straight: blue_2_1}
    at: [13, 11]
    flip: true
  sw48: # the north-east siding pair, off sw49's diverging leg
    kind: turnout
    connection: station_c_east_b2
    names: {straight: siding_5, diverging: siding_4}
    at: [13, 9]
    rot: 180

  # The far end of every siding is a deliberate track end, so it takes a
  # terminal symbol; those five blocks are what derives as terminal.
  station_c_4_B_stop: {kind: terminal, at: [6, 10], rot: 180}
  station_c_5_B_stop: {kind: terminal, at: [6, 9], rot: 180}
  station_c_6_B_stop: {kind: terminal, at: [1, 14], rot: 180}
  station_c_7_B_stop: {kind: terminal, at: [1, 15], rot: 180}
  station_a_4_B_stop: {kind: terminal, at: [35, 3]}

  # A free-standing bend, and the only symbol here that is not the railroad:
  # sw49's toe faces east, so blue 2 comes down over the station, turns here,
  # and runs back west into it, which is how the line reaches the toe without
  # being drawn across the throat. A bend is a joiner, so it declares no
  # transit and composes no conflict — every way through it already shares
  # sw49, which the derived layout confirms.
  blue_2_bend: {kind: pin, at: [17, 11]}

wires:
  - [line_blue_2.B, sw17.toe]
  - [sw17.straight, sw18.straight]
  - [sw17.diverging, sw16.b1]
  - [sw16.b2, sw20.diverging]
  - [sw19.diverging, sw16.a1]
  - [sw16.a2, sw18.diverging]
  - [sw18.toe, sw41.toe]
  - [sw41.straight, station_a_1.A]
  - [sw41.diverging, sw42.toe]
  - [sw42.straight, station_a_2.A]
  - [sw42.diverging, station_a_3.A]
  - [line_yellow.A, sw51.straight]
  - [line_blue_1.B, sw51.diverging]
  - [sw51.toe, sw19.toe]
  - [sw19.straight, sw20.straight]
  - [sw20.toe, return_loop.P]
  - [return_loop.P, sw35.toe]
  - [sw35.straight, station_a_1.B]
  - [sw35.diverging, sw36.toe]
  - [sw36.straight, station_a_2.B]
  - [sw36.diverging, sw39.diverging]
  - [sw39.toe, station_a_3.B]
  - [sw39.straight, station_a_4.A]
  - [line_yellow.B, sw24.toe]
  - [sw24.straight, station_c_1.A]
  - [sw24.diverging, sw46.toe]
  - [sw46.straight, station_c_2.A]
  - [sw46.diverging, sw44.straight]
  - [sw44.toe, station_c_3.A]
  - [sw44.diverging, sw45.toe]
  - [sw45.straight, station_c_6.A]
  - [sw45.diverging, station_c_7.A]
  - [line_blue_1.A, sw50.toe]
  - [sw50.straight, station_c_2.B]
  - [sw50.diverging, station_c_3.B]
  - [line_blue_2.A, blue_2_bend.P]
  - [blue_2_bend.P, sw49.toe]
  - [sw49.straight, station_c_1.B]
  - [sw49.diverging, sw48.toe]
  - [sw48.straight, station_c_5.A]
  - [sw48.diverging, station_c_4.A]
  - [station_c_4.B, station_c_4_B_stop.P]
  - [station_c_5.B, station_c_5_B_stop.P]
  - [station_c_6.B, station_c_6_B_stop.P]
  - [station_c_7.B, station_c_7_B_stop.P]
  - [station_a_4.B, station_a_4_B_stop.P]
