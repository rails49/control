# gotthard/obstacle — a permanent obstacle, named (docs/BENCHMARKS.md, #31).
#
# Stock left standing on `CE1` (blue 1) and a request departing `C3b.A`.
# Track 3's east end is `C3b.A`, and blue 1 is the only line it reaches, so the
# departure end fixes the line by itself: every route out of `C3b.A` crosses
# `CE1`, whatever the request names as its destination.
#
# The request therefore stalls however many arrival ends it names. `stranded`
# names all three Airolo tracks — the widest set the layout offers — and it
# changes nothing.
#
# Expected status `stalled`, with the obstacle named: `CE1`, held by `stock`.
# This is SAFETY.md's conditional-liveness proviso failing in the open —
# nothing in the dispatcher will move `stock`, so its block is permanently
# unavailable — turned from a paragraph into a visible, tested output.
#
# Ported from `gotthard-v0/obstacle` in #161. `claro_3.B` is `C3b.A` on the
# drawn railroad, and the choice of half is forced: `C3a` has no east end at
# all, and from `C3a.B` the yellow is available, which would dissolve the
# premise.

scenario: obstacle
layout: gotthard

trains:
  stranded: { at: C3b, facing: B-to-A }
  stock: { at: CE1, facing: B-to-A } # idle: no request names it

requests:
  - { train: stranded, from: C3b.A, to: [A1, A2, A3] }
