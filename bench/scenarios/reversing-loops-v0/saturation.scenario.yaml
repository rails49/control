# reversing-loops-v0/saturation — the headline workload (docs/BENCHMARKS.md,
# #31).
#
# Five trains, three workings each, every request in at the start. Batch arrivals
# make makespan the drain time and contention maximal, which is where the two
# locking strategies are supposed to separate.
#
# Five is the ceiling, per BENCHMARKS.md's axis note: `reversing-loops` has six
# station tracks, and at six every arrival block would be a permanent obstacle
# at the start. At five there is exactly one free track, so the whole workload
# is a rotation — each train moves into the slot the train ahead of it has just
# vacated, and the free slot travels round the six tracks three times. Nothing
# drains except by rotation, which is what makes this saturation rather than
# merely traffic.
#
# The workings are line workings, station-C <-> station-A, chained: request n+1
# departs from wherever request n parked the train, so only a train's first
# working states a departure block and the rest state only an end.
#
# `|dest| = 2` throughout — one track, either way round, BENCHMARKS.md's
# continuity point and the column every other is read against. Before
# congestion-aware costing (#33) it was also what kept the run alive at the
# default `k = 2`: at `|dest| = 6` every train tried station_c_1 then
# station_c_2 and nothing else — the lexicographic bias BENCHMARKS.md predicted
# — and the run stalled outright at once. Costing removed that bias and carried
# the rotation to 11 of 15 workings; the aging rule (#34) removed the residue
# (older trains parking on the last free station-A tracks for good), and the
# widened workload now drains fully (test_benchmarks.py). The committed
# scenario stays at `|dest| = 2` for the continuity column.
#
# Departure ends alternate deliberately rather than uniformly. At station-C the
# east end of a track is served by a blue line and the west end by the yellow,
# so a workload that always departs the same way never touches one of the three
# line sections; departing both ways is what puts all three under load.
# Departing station-A the choice is real either way, since all three lines meet
# at WX310 — and that is where `k = 2` earns its keep, choosing between two
# lines rather than two ends of one track.

scenario: saturation
layout: reversing-loops-v0

trains:
  t1: { at: station_c_1, facing: A-to-B }
  t2: { at: station_c_2, facing: B-to-A }
  t3: { at: station_c_3, facing: A-to-B }
  t4: { at: station_a_1, facing: B-to-A }
  t5: { at: station_a_2, facing: A-to-B }

# station_a_3 is the one free track at the start, so t1 is the only train that
# can launch; every other request is waiting on the slot t1 is about to vacate.
requests:
  - { train: t1, from: station_c_1.B, to: [station_a_3] } # blue 2
  - { train: t1, from: A, to: [station_c_3] }
  - { train: t1, from: A, to: [station_a_2] } # the yellow

  - { train: t2, from: station_c_2.A, to: [station_a_1] } # the yellow
  - { train: t2, from: B, to: [station_c_1] }
  - { train: t2, from: B, to: [station_a_3] } # blue 2

  - { train: t3, from: station_c_3.B, to: [station_a_2] } # blue 1
  - { train: t3, from: B, to: [station_c_2] }
  - { train: t3, from: A, to: [station_a_1] } # the yellow

  - { train: t4, from: station_a_1.A, to: [station_c_1] }
  - { train: t4, from: B, to: [station_a_3] } # blue 2
  - { train: t4, from: B, to: [station_c_3] }

  - { train: t5, from: station_a_2.B, to: [station_c_2] }
  - { train: t5, from: B, to: [station_a_1] } # blue 2
  - { train: t5, from: A, to: [station_c_1] }
