# crossover-yard/meet — the small, fast named benchmark (#8).
#
# A scenario is one layout, the stock standing on it, and the fixed request
# list fed to the dispatcher. Kept separate from the layout so one layout can
# carry many scenarios. Format per docs/LAYOUT.md.
#
# This one is the meet: two trains starting nose-to-nose on the up line, each
# needing the other's end of the railroad. Full-route locking serialises them;
# incremental locking should route one over the crossover onto the down line.

scenario: meet
layout: crossover-yard

# A scenario places the railroad's trains: a starting block and a facing — the
# run the train would make across it, `A-to-B` departing nose-first through
# that block's B end (CONTEXT.md). The train itself
# is the roster's and so is its length (ADR-0039). Facing is scheduler state
# the dispatcher never reads (ADR-0019): file scenarios like this one state the
# departure end per request, and a request is free to contradict the facing.
trains:
  freight_1: { at: yard_w, facing: A-to-B }
  express_2: { at: up_e, facing: B-to-A }

# request = (train, departure end, arrival ends), per ADR-0007.
#
# `to` is a list and any one entry satisfies the request. A bare block id means
# either end of it, so `to: [yard_e]` is `yard_e.A` and `yard_e.B` — and since
# yard_e is terminal, `.B` appears in no connection and is pruned at admission,
# recorded on `request_admitted`. Both yards are single blocks, so this layout
# has no genuine choice of arrival track to show; `reversing-loops` is where
# that lives.
#
# `from` needs only the end. It carries the block where the author knows it,
# and is then checked at load, against the block the file leaves the train in.
# freight_1's return working can still state `yard_e.A`, because its outward
# request names ends in one block and so fixed where it parks; a working whose
# predecessor named several could not, and writes a bare end letter. It departs by the end it
# arrived through, which is reversal at rest between requests (ADR-0001) and is
# the only way out of a terminal block.
#
# The return heads for the down main, not yard_w: express_2 parks in yard_w
# when its request completes, and an idle train's block is permanently
# unavailable (SAFETY.md) — a return to yard_w could never complete.
requests:
  - { train: freight_1, from: yard_w.B, to: [yard_e] }
  - { train: express_2, from: up_e.A, to: [yard_w] }
  - { train: freight_1, from: yard_e.A, to: [dn_w] } # return working
